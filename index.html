  const bars = g.map(x => {
    const d = x.pf - x.pa, hgt = Math.max(6, Math.round(Math.abs(d) / mx * 78));
    const tip = `${x.win ? 'W' : 'L'} ${x.pf}-${x.pa} ${x.home ? 'vs' : '@'} ${x.opp}`;
    const bar = `<i style="height:${hgt}%;background:${x.win ? color : 'var(--bad)'}"></i>`;
    return `<a class="mg" href="${gameHref(etDay(x.date), x.id)}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="mg-up">${d > 0 ? `<em>+${d}</em>${bar}` : ''}</span><span class="mg-dn">${d < 0 ? `${bar}<em>${d}</em>` : ''}</span><span class="mg-o">${x.home ? '' : '@'}${esc(x.opp)}</span></a>`;
  }).join('');
  return `<div class="mgc"><div class="mgc-h"><span><span class="cdot" style="background:${color}"></span>${esc(side.abbr)}</span><span>${esc(rec.last10)} · ${esc(rec.streak)}</span></div><div class="mgrid">${bars}</div></div>`;
}

function matchupView(e, L, A, B, m, board) {
  const year = board?.leagues?.[0]?.season?.year;
  if (!year) return `<p class="p-note">Matchup data isn't available for this game.</p>`;
  const ca = m.a.bright, cb = m.b.bright;
  let h = '';

  // records: this season before this game; last season if either team hasn't played yet
  const before = g => !e.date || Date.parse(g.date) < Date.parse(e.date) - 3600e3;
  const sched = y => [A, B].map(s => need(`sched.${state.league}.${s.id}.${y}`, () => fetchSchedule(state.league, s.id, y)));
  let sc = sched(year), recYear = year;
  const curOk = sc.every(x => x.status === 'ok');
  if (curOk && sc.some(x => !x.data.some(g => g.completed && before(g)))) { sc = sched(year - 1); recYear = year - 1; }
  if (sc.some(x => x.status === 'loading')) h += `<section class="sec"><h2>Records</h2>${skeleton(1)}</section>`;
  else if (sc.some(x => x.status === 'err')) h += `<section class="sec"><h2>Records</h2><div class="err"><p><b>Team schedules didn't load.</b></p><button class="btn primary" type="button" data-act="retryPlayers">Try again</button></div></section>`;
  else {
    const [ra, rb] = sc.map(x => recordsFrom(x.data.filter(g => g.completed && (recYear !== year || before(g)))));
    const label = recYear === year ? `${seasonLabel(year)} season, before this game` : `${seasonLabel(recYear)} season · no ${seasonLabel(year)} games yet`;
    const row = (l, a, b, cls = '') => `<div class="rc-row${cls}"><span class="rc-v">${a}</span><span class="rc-l">${l}</span><span class="rc-v r">${b}</span></div>`;
    const awayFirst = A === e.away;
    h += `<section class="sec"><h2>Records</h2><div class="rc">
      <div class="rc-row rc-top">${tLinkBox(A, `${logo(A, 40)}<b>${esc(A.abbr)}</b>`, 'rc-t')}<span class="rc-at">${awayFirst ? '@' : 'vs'}</span>${tLinkBox(B, `${logo(B, 40)}<b>${esc(B.abbr)}</b>`, 'rc-t r')}</div>
      ${row('Record', ra.all, rb.all)}${row('Last 10', ra.last10, rb.last10)}
      ${awayFirst ? row('Away · Home', ra.away, rb.home) : row('Home · Away', ra.home, rb.away)}
      ${row('Streak', ra.streak || '–', rb.streak || '–')}
      ${row('Points scored', ra.ppg == null ? '–' : ra.ppg.toFixed(1), rb.ppg == null ? '–' : rb.ppg.toFixed(1))}
      ${row('Points allowed', ra.oppg == null ? '–' : ra.oppg.toFixed(1), rb.oppg == null ? '–' : rb.oppg.toFixed(1))}
      ${row('Point diff', sign1(ra.ppg == null ? null : ra.ppg - ra.oppg), sign1(rb.ppg == null ? null : rb.ppg - rb.oppg))}
      </div><p class="p-note">${esc(label)} · regular season only</p></section>`;
    h += `<section class="sec"><h2>Last 10 games · winning margin</h2><div class="mgw">${marginChart(ra, A, ca)}${marginChart(rb, B, cb)}</div></section>`;
  }

  // team season stats, league ranks
  let ts = need(`teams.${state.league}.${year}`, () => teamStats(state.league, year)), tsYear = year;
  if (ts.status === 'ok' && [A, B].some(s => !(ts.data.get(s.id)?.gp > 0))) { ts = need(`teams.${state.league}.${year - 1}`, () => teamStats(state.league, year - 1)); tsYear = year - 1; }
  if (ts.status === 'loading') h += `<section class="sec"><h2>Team stats</h2>${skeleton(1)}</section>`;
  else if (ts.status === 'ok') {
    const sa = ts.data.get(A.id), sb = ts.data.get(B.id);
    if (sa && sb) {
      const r = (label, k, opts = {}) => {
        const a = sa[k], b = sb[k];
        if (!a || !b) return null;
        const d = opts.pct ? v => v.toFixed(1) + '%' : v => v.toFixed(1);
        const rk = x => !opts.noRank && x.rank ? `${ordinal(x.rank)} in ${L.label}` : '';
        return { label, a: d(a.v), b: d(b.v), as: rk(a), bs: rk(b), av: a.v, bv: b.v, low: !!opts.low };
      };
      const rows = [r('Points', 'ppg'), r('Points allowed', 'oppg', { low: true, noRank: true }), r('Field goal %', 'fg', { pct: true }), r('Three-point %', 'tp', { pct: true }),
        r('Free throw %', 'ft', { pct: true }), r('Rebounds', 'reb'), r('Assists', 'ast'), r('Turnovers', 'tov', { low: true, noRank: true }), r('Steals', 'stl'), r('Blocks', 'blk'),
        r('Opponent FG %', 'oppfg', { pct: true, low: true, noRank: true })].filter(Boolean);
      // the comparison bar shows share of the pair; for "lower is better" rows the shorter bar is the better team
      h += `<section class="sec"><h2>Team stats per game</h2><div class="ts"><div class="ts-head"><span><span class="cdot" style="background:${ca}"></span>${teamAb(A)}</span><span>${teamAb(B)}<span class="cdot r" style="background:${cb}"></span></span></div>${rows.map(x => tsRow(x, ca, cb)).join('')}</div><p class="p-note">${esc(seasonLabel(tsYear))} regular season${tsYear !== year ? ` · no ${seasonLabel(year)} games yet` : ''} · ranks among all ${esc(L.label)} teams</p></section>`;
    }
  }

  // leaders: this game's box score once it has started, season averages before tip-off
  const ta = e.state === 'pre' ? teamRows(A, board) : { st: 'game' }, tb = e.state === 'pre' ? teamRows(B, board) : { st: 'game' };
  if (e.state !== 'pre') h += gameLeaders(e, A, B, m);
  else if (ta.st === 'ok' && tb.st === 'ok') {
    const top = (t, k) => t.rows.filter(r => r.s && r.s[k] != null).sort((x, y) => y.s[k] - x.s[k])[0];
    const cats = [['Points', 'pts', 'PPG'], ['Rebounds', 'reb', 'RPG'], ['Assists', 'ast', 'APG'], ['Steals', 'stl', 'SPG'], ['Blocks', 'blk', 'BPG']];
    const cell = (r, unit, right, color) => r ? `<a class="ld-p${right ? ' r' : ''}" href="${plHref(r.p.id)}" data-pl style="--tc:${color}">${headshot(r.p, state.league)}<span class="ld-txt"><b>${f1(r.s[unit.k])}</b><span>${esc(r.p.short || r.p.name)}</span></span></a>` : '<span class="ld-p"></span>';
    const lrows = cats.map(([label, k, unit]) => `<div class="ld-row">${cell(top(ta, k), { k }, false, m.a.banner)}<span class="ld-l">${label}<small>${unit}</small></span>${cell(top(tb, k), { k }, true, m.b.banner)}</div>`).join('');
    h += `<section class="sec"><h2>Team leaders</h2><div class="ld">${lrows}</div><p class="p-note">${ta.anyCur || tb.anyCur ? `${esc(seasonLabel(ta.year))} averages; players who haven't played yet use ${esc(seasonLabel(ta.year - 1))}` : `${esc(seasonLabel(ta.year - 1))} averages`} · tap a player for their profile</p></section>`;
  } else if (ta.st === 'loading' || tb.st === 'loading') h += `<section class="sec"><h2>Team leaders</h2>${skeleton(1)}</section>`;

  // head-to-head over recent seasons
  if (state.league === 'nba' && A && B) h += `<section class="sec"><h2>Head-to-head · last ${H2H_SEASONS} seasons</h2>${h2hSummary(A.id, B.id, { compact: true })}</section>`;

  // season series
  const ss = state.summary?.seasonseries?.[0];
  if (ss && (ss.events || []).length) {
    const games = ss.events.map(g => {
      const cs = g.competitors || [];
      const fin = g.statusType?.completed || g.status === 'post';
      const ta2 = cs.find(c => String(c.team?.id) === A.id), tb2 = cs.find(c => String(c.team?.id) === B.id);
      const where = cs.find(c => c.homeAway === 'home')?.team?.abbreviation || '';
      const when = g.date ? fmtUS.format(new Date(g.date)) : '';
      const res = fin && ta2 && tb2 ? `${esc(A.abbr)} ${esc(ta2.score)} – ${esc(tb2.score)} ${esc(B.abbr)}` : 'Upcoming';
      const cur = String(g.id) === state.gameId;
      const inner = `<span>${esc(when)}</span><span>at ${esc(where)}</span><b>${res}</b>`;
      return cur || !g.date ? `<div class="ss-g${cur ? ' cur' : ''}">${inner}</div>` : `<a class="ss-g" href="${gameHref(etDay(g.date), String(g.id))}">${inner}</a>`;
    }).join('');
    h += `<section class="sec"><h2>${esc(ss.title || 'Season series')}</h2><div class="ss"><p class="ss-sum">${esc(ss.summary || '')}</p>${games}</div></section>`;
  }

  // injury report
  const inj = [...injuryMap().entries()].map(([pid, i]) => ({ ...i, pid }));
  if (state.summary) {
    const col = (s) => {
      const list = inj.filter(i => i.team === s.id);
      return `<div class="inj-c">${tLinkBox(s, `${logo(s, 22)}${esc(s.abbr)}`, 'inj-h')}${list.length ? list.map(i => `<div class="inj-r"><a class="plain" href="${hashFor({ view: 'player', playerId: i.pid })}">${esc(i.name)}</a><span class="tag ${/out/i.test(i.status) ? 'out' : 'gtd'}">${esc(i.status)}</span>${i.detail ? `<small>${esc(i.detail)}</small>` : ''}</div>`).join('') : '<p class="p-note">No injuries reported.</p>'}</div>`;
    };
    h += `<section class="sec"><h2>Injury report</h2><div class="inj">${col(A)}${col(B)}</div></section>`;
  }
  return h;
}

/* ---------- one player's single-game performance ---------- */
// The game a player link points into, once that game has started and he is in its box score.
function evFromSummary() {
  const hc = state.summary?.header?.competitions?.[0];
  if (!hc || !Array.isArray(hc.competitors) || hc.competitors.length < 2) return null;
  return parseEvent({ id: state.gameId, date: hc.date, competitions: [hc], status: hc.status, season: state.summary.header.season });
}
function perfCtx() {
  if (!state.gameId || state.league !== 'nba') return null;
  const e = curEvent() || evFromSummary();
  if (!e) return boards.get(boardKey()) || state.error || state.summaryErr ? null : 'loading';
  if (e.state === 'pre') return null;
  if (!state.summary) return state.summaryErr ? null : 'loading';
  for (const s of [e.away, e.home]) if (s && (boxPlayers(state.summary, s.id) || []).some(p => p.id === state.playerId)) return e;
  return null;
}
const nameSize = n => n.length > 12 ? ' xlong' : n.length > 8 ? ' long' : '';
function playerPage() {
  const c = perfCtx();
  return c === 'loading' ? skeleton(2) : c ? performanceView(c) : profileView();
}
function playerShots(pb, pid) {
  const onCourt = p => p.x != null && p.y != null && p.x >= 0 && p.x <= 50 && p.y >= -5 && p.y <= 42;
  return pb.plays.filter(p => p.shooting && p.athletes[0] === pid && onCourt(p) && !/free throw/i.test(p.type + ' ' + p.text) && (p.pa == null || p.pa >= 2));
}
function performanceView(e) {
  const L = LEAGUES.nba, pid = state.playerId, sum = state.summary;
  let me = null, side = null;
  for (const s of [e.away, e.home]) { const x = (boxPlayers(sum, s.id) || []).find(p => p.id === pid); if (x) { me = x; side = s; } }
  const opp = side === e.home ? e.away : e.home;
  const c = teamColorById(side.id);
  const g = me.game || {};
  const live = e.state === 'in', done = e.state === 'post' && e.completed;
  const mineScore = nz(side.score), oppScore = nz(opp.score);
  const result = done ? `${side.winner || mineScore > oppScore ? 'W' : 'L'} ${mineScore}-${oppScore}` : live ? `${esc(statusText(e, L))} · ${mineScore}-${oppScore}` : '';
  const first = (me.name || '').split(' ')[0], lastN = (me.name || '').split(' ').slice(1).join(' ') || me.name;
  const dt = e.date ? new Date(e.date) : null;
  let h = `<section class="pro perf-pro" style="${bannerVars(c)}">${me.jersey ? `<span class="pro-num" aria-hidden="true">${esc(me.jersey)}</span>` : ''}
    <div class="pro-img">${headshot(me, 'nba', 'lg', 'big')}</div>
    <div class="pro-txt"><a class="pro-team" href="${teamHref(side.id)}">${logo(side, 22, true)}${esc(side.full || side.name || side.abbr)}</a>
      <span class="pro-first">${esc(first)}</span><h1 class="pro-last${nameSize(lastN)}"><a class="plain" href="${hashFor({ view: 'player', playerId: pid })}">${esc(lastN)}</a></h1>
      <span class="pro-meta">${esc([me.jersey ? '#' + me.jersey : '', me.pos, me.starter ? 'Starter' : 'Bench'].filter(Boolean).join(' · '))}</span></div>
    <a class="pro-game" href="${gameHref(state.day, e.id)}"><span>${side === e.home ? 'vs' : '@'} ${esc(opp.abbr)}${dt ? ' · ' + esc(fmtLocalWk.format(dt) + ' ' + fmtDM.format(dt)) : ''}</span><b class="${done ? (result.startsWith('W') ? 'w' : 'l') : ''}">${result}</b>${live ? '<i class="live-dot"></i>' : ''}</a></section>`;
  h += `<div class="ph-actions"><a class="btn" href="${gameHref(state.day, e.id)}">Box score</a><a class="btn" href="${teamHref(opp.id)}">${esc(opp.abbr)} team page</a><a class="btn" href="${hashFor({ view: 'player', playerId: pid })}">Full profile</a></div>`;
  if (!me.game) return h + `<section class="sec"><div class="empty"><p class="big">Didn't play</p><p>${esc(me.reason || 'Did not play')}</p></div></section>`;

  // the stat line
  const bigs = [['PTS', g.pts], ['REB', g.reb], ['AST', g.ast]];
  const smalls = [['MIN', g.min], ['STL', g.stl], ['BLK', g.blk], ['TO', g.to], ['OREB', g.oreb], ['DREB', g.dreb], ['PF', g.pf], ['+/-', g.pm]];
  h += `<section class="sec"><h2>${live ? 'Stat line · live' : 'Stat line'}</h2><div class="sl-big">${bigs.map(([l, v]) => `<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div><div class="tiles small eight">${smalls.map(([l, v]) => `<div class="tile"><b class="${l === '+/-' ? (nz(v) > 0 ? 'pm-pos' : nz(v) < 0 ? 'pm-neg' : '') : ''}">${esc(v === '' ? '–' : v)}</b><span>${l}</span></div>`).join('')}</div></section>`;

  // highlights: badges, Game Score, where he ranked in this game
  const everyone = [e.away, e.home].flatMap(s => (boxPlayers(sum, s.id) || []).filter(p => p.game).map(p => ({ ...p, team: s.id })));
  // where his numbers ranked in this game; ties are called ties
  const top = (k, list) => !list.some(p => nz(p.game[k]) > nz(g[k])), tied = (k, list) => list.some(p => p.id !== pid && nz(p.game[k]) === nz(g[k]));
  const notes = [];
  for (const [k, l] of [['pts', 'points'], ['reb', 'rebounds'], ['ast', 'assists'], ['stl', 'steals'], ['blk', 'blocks']]) {
    if (nz(g[k]) <= 0) continue;
    const mine = everyone.filter(p => p.team === side.id);
    if (top(k, everyone)) notes.push(tied(k, everyone) ? `Tied for most ${l}` : `Most ${l} in the game`);
    else if (top(k, mine)) notes.push(tied(k, mine) ? `Tied for the ${side.abbr} lead in ${l}` : `Led ${side.abbr} in ${l}`);
  }
  const badges = [...feats(g), ...notes].map(f => `<span class="badge">${esc(f)}</span>`).join('');
  h += `<section class="sec"><div class="hl"><div class="hl-gs"><b>${gameScore(g).toFixed(1)}</b><span>Game Score</span></div><div class="badges">${badges || '<span class="p-note">No standout marks this time.</span>'}</div></div></section>`;

  // shooting
  const split = s => { const [mk, at] = String(s || '').split('-').map(nz); return { mk, at }; };
  const fg = split(g.fg), tp = split(g.tp), ft = split(g.ft), two = { mk: fg.mk - tp.mk, at: fg.at - tp.at };
  const shootRow = (l, x) => `<div class="sh-row"><span class="sh-l">${l}</span><span class="sh-v"><b>${x.mk}/${x.at}</b><small>${x.at ? Math.round(x.mk / x.at * 100) + '%' : '–'}</small></span><span class="sh-bar"><i style="width:${x.at ? (x.mk / x.at * 100).toFixed(1) : 0}%;background:${c.bright}"></i></span></div>`;
  h += `<section class="sec"><h2>Shooting</h2><div class="shoot">${shootRow('Field goals', fg)}${shootRow('2-pointers', two)}${shootRow('3-pointers', tp)}${shootRow('Free throws', ft)}</div></section>`;

  // from the play-by-play: points by quarter, shot chart, his plays
  const pb = state.pbp?.gid === state.gameId ? state.pbp : null;
  if (!pb) h += `<section class="sec"><h2>Play-by-play</h2>${skeleton(1)}</section>`;
  else if (pb.plays.length) {
    const mine = pb.plays.filter(p => p.athletes.includes(pid));
    const periods = Math.max(4, ...pb.plays.map(p => p.period || 0));
    const byQ = Array.from({ length: periods }, (_, i) => mine.filter(p => p.period === i + 1 && p.scoring && p.athletes[0] === pid).reduce((t, p) => t + nz(p.value), 0));
    const mx = Math.max(4, ...byQ), qSum = byQ.reduce((t, v) => t + v, 0);
    // only when the play-by-play adds up to his box-score points (the two feeds can be briefly out of step during a game)
    if (qSum === nz(g.pts)) h += `<section class="sec"><h2>Points by quarter</h2><div class="qbars">${byQ.map((v, i) => `<div class="qb"><span class="qb-v">${v}</span><span class="qb-track"><i style="height:${(v / mx * 100).toFixed(1)}%;background:${c.bright}"></i></span><span class="qb-l">${qLabel(i + 1, periods)}</span></div>`).join('')}</div></section>`;
    const shots = playerShots(pb, pid);
    if (shots.length) {
      const made = s => s.scoring || s.value > 0;
      const marks = shots.map(s => { const x = s.x, y = courtY(s.y); return made(s) ? `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1" class="sh-made" fill="${c.bright}"/>` : `<path d="M${(x - .7).toFixed(2)} ${(y - .7).toFixed(2)}l1.4 1.4m0 -1.4l-1.4 1.4" class="sh-miss" stroke="${c.bright}"/>`; }).join('');
      h += `<section class="sec"><h2>Shot chart</h2><div class="shot-c"><svg viewBox="-0.5 -0.5 51 48" class="court" role="img" aria-label="${esc(`${shots.filter(made).length} of ${shots.length} field goals made`)}">${COURT}${marks}</svg><div class="legend"><span><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="${c.bright}"/></svg> Made</span><span><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6m0-6l-6 6" stroke="${c.bright}" stroke-width="2"/></svg> Missed</span></div></div></section>`;
    }
    const aHome = side === e.home;
    const list = mine.filter(p => p.text).sort((a, b) => b.seq - a.seq).slice(0, 60);
    if (list.length) h += `<section class="sec"><h2>His plays</h2><div class="pbp mine">${list.map(p => `<div class="pbp-r${p.scoring && p.athletes[0] === pid ? ' sc' : ''}"><span class="pbp-t">${esc(qLabel(p.period, periods))} ${esc(p.clock)}</span><span class="pbp-bar" style="background:${p.team === side.id ? c.bright : 'var(--line)'}"></span><span class="pbp-x">${esc(p.text)}</span><span class="pbp-s">${esc(aHome ? p.home : p.away)}-${esc(aHome ? p.away : p.home)}</span></div>`).join('')}</div><p class="p-note">Newest first · score shown ${esc(side.abbr)}-${esc(opp.abbr)} · plays where he shot, passed, rebounded, fouled or was fouled</p></section>`;
  }
  return h;
}

// A team's abbreviation as a link to its team page (NBA only; other leagues have no team pages here).
const tLinkBox = (s, inner, cls) => state.league === 'nba' && s?.id ? `<a class="${cls}" href="${teamHref(s.id)}">${inner}</a>` : `<span class="${cls}">${inner}</span>`;
const teamAb = s => state.league === 'nba' && s?.id ? `<a class="plain" href="${teamHref(s.id)}">${esc(s.abbr)}</a>` : esc(s?.abbr || '');
// Matchup tab once the game has started: leaders from this game's box score, no season averages.
function gameLeaders(e, A, B, m) {
  if (!state.summary) return `<section class="sec"><h2>Game leaders</h2>${skeleton(1)}</section>`;
  const pa = (boxPlayers(state.summary, A.id) || []).filter(p => p.game), pb = (boxPlayers(state.summary, B.id) || []).filter(p => p.game);
  if (!pa.length || !pb.length) return '';
  const top = (list, k) => list.slice().sort((x, y) => nz(y.game[k]) - nz(x.game[k]) || nz(y.game.pts) - nz(x.game.pts))[0];
  const cats = [['Points', 'pts', 'PTS'], ['Rebounds', 'reb', 'REB'], ['Assists', 'ast', 'AST'], ['Steals', 'stl', 'STL'], ['Blocks', 'blk', 'BLK']];
  const cell = (p, k, right, color) => p ? `<a class="ld-p${right ? ' r' : ''}" href="${perfHref(state.day, e.id, p.id)}" style="--tc:${color}">${headshot(p, state.league)}<span class="ld-txt"><b>${esc(p.game[k])}</b><span>${esc(p.short || p.name)}</span></span></a>` : '<span class="ld-p"></span>';
  const rows = cats.map(([label, k, unit]) => `<div class="ld-row">${cell(top(pa, k), k, false, m.a.banner)}<span class="ld-l">${label}<small>${unit}</small></span>${cell(top(pb, k), k, true, m.b.banner)}</div>`).join('');
  return `<section class="sec"><h2>Game leaders${e.state === 'in' ? ' · live' : ''}</h2><div class="ld">${rows}</div><p class="p-note">From this game's box score · tap a player for his full performance</p></section>`;
}

/* ---------- player profile ---------- */
const athleteBase = league => `https://site.web.api.espn.com/apis/common/v3/sports/${LEAGUES[league].path}/athletes/`;
// Walks ESPN's game-log JSON for {eventId, stats} entries, noting which season type each sits under.
function parseGamelog(j) {
  const labels = j?.labels || [], evs = j?.events || {}, rows = new Map();
  const kindOf = name => /preseason/i.test(name) ? 'pre' : /post|playoff|play-in/i.test(name) ? 'post' : /regular/i.test(name) ? 'reg' : '';
  const walk = (node, kind, depth) => {
    if (!node || typeof node !== 'object' || depth > 8) return;
    if (Array.isArray(node)) { for (const n of node) walk(n, kind, depth + 1); return; }
    const k = kindOf(String(node.displayName || node.name || '')) || kind;
    if (node.eventId != null && Array.isArray(node.stats)) {
      const id = String(node.eventId), info = evs[id];
      if (info && !rows.has(id)) {
        const note = info.eventNote || '';
        rows.set(id, { id, date: info.gameDate, atVs: info.atVs || '', opp: info.opponent?.abbreviation || '', oppId: String(info.opponent?.id ?? ''), res: info.gameResult || '', score: info.score || '', note, stats: node.stats, kind: k || (/round|finals|play-in|game \d/i.test(note) ? 'post' : '') });
      }
      return;
    }
    for (const key of Object.keys(node)) if (!(depth === 0 && ['events', 'filters', 'labels', 'names', 'displayNames'].includes(key))) walk(node[key], k, depth + 1);
  };
  walk(j, '', 0);
  return { labels, rows: [...rows.values()].filter(r => r.kind !== 'pre').sort((a, b) => Date.parse(b.date) - Date.parse(a.date)), seasons: (j?.filters || []).find(f => /season/i.test(f.name || ''))?.options || [] };
}
function careerOf(j) {
  const cat = (j?.categories || []).find(c => c.name === 'averages') || (j?.categories || [])[0];
  if (!cat) return null;
  const names = cat.names || [];
  const val = (arr, n) => { const i = names.indexOf(n); return i < 0 ? '' : (arr?.[i] ?? ''); };
  const rows = (cat.statistics || []).map(x => ({ year: x.season?.year, label: x.season?.displayName || '', teamId: String(x.teamId ?? ''), stats: x.stats || [] })).filter(r => r.year);
  return { names, val, rows: rows.sort((a, b) => b.year - a.year), totals: cat.totals || null };
}

function playerRow({ p, s, tag }, injury, leagueKey, gameLabel, started) {

    body = s ? `<div class="avg">${cells.map(([l, v]) => `<span><b>${f1(v)}</b><i>${l}</i></span>`).join('')}</div>` : `<div class="pc-meta">No ${esc(LEAGUES[leagueKey]?.label || '')} averages yet</div>`;

function boxSection(e, L, A, B, ca, cb, pre) {
  const sum = state.summary;
  if (!sum) return state.summaryErr ? `<div class="err"><p><b>The box score didn't load.</b></p><button class="btn" type="button" data-act="refresh">Try again</button></div>` : skeleton(1);
  const players = sum.boxscore?.players || [];
  const byTeam = id => players.find(p => String(p.team?.id) === id);
  const pa = byTeam(A.id), pb = byTeam(B.id);
  if (!pa && !pb) {
    return `<div class="empty" style="padding:24px 12px"><p>${pre ? 'The box score fills in once the game starts.' : 'No player box score for this game.'}</p></div>`;
  }
  if (!state.boxTeam || ![A.id, B.id].includes(state.boxTeam)) state.boxTeam = pa ? A.id : B.id;
  const tab = (s, c, has) => `<button class="tab" type="button" role="tab" data-team="${esc(s.id)}" aria-selected="${state.boxTeam === s.id}" style="--tc:${c}"${has ? '' : ' disabled'}>${logo(s, 22, state.boxTeam === s.id)}${esc(s.abbr)}</button>`;
  const cur = state.boxTeam === A.id ? pa : pb;
  const groups = (cur?.statistics || []).filter(g => (g.athletes || []).length);
  let h = `<div class="tabs" role="tablist">${tab(A, ca, !!pa)}${tab(B, cb, !!pb)}</div>`;
  if (!groups.length) return h + `<div class="empty" style="padding:24px 12px"><p>No player stats yet.</p></div>`;
  groups.forEach((g, gi) => { h += groupTable(g, gi, L, groups.length > 1); });
  h += `<p class="hint">Tap a column to sort. Tap it again to reset.</p>`;
  return h;
}

function groupTable(g, gi, L, titled) {
  const labels = g.labels || g.names || [];
  const desc = g.descriptions || [];
  const sorted = state.sort && state.sort.g === gi && state.sort.team === state.boxTeam;
  const played = a => !a.didNotPlay && (a.stats || []).length > 0;
  let ath = (g.athletes || []).map((a, i) => ({ ...a, _i: i }));
  if (sorted) {
    const c = state.sort.col;
    ath.sort((a, b) => (played(b) - played(a)) || (num(b.stats?.[c]) - num(a.stats?.[c])) || a._i - b._i);
  }
  const ptsIdx = labels.indexOf('PTS');
  const pmIdx = labels.indexOf('+/-');
  const title = (g.text || g.name || '').replace(/^\w/, c => c.toUpperCase());
  let h = titled && title ? `<div class="grp">${esc(title)}</div>` : '';
  h += `<div class="scroll" data-scroll="box-${gi}-${esc(state.boxTeam)}"><table class="box"><thead><tr><th class="pl" scope="col">${L.sport === 'bb' ? 'Player' : esc(title || 'Player')}</th>`;
  h += labels.map((l, i) => `<th scope="col"><button class="sort${sorted && state.sort.col === i ? ' on' : ''}" type="button" data-g="${gi}" data-c="${i}" title="${esc(desc[i] || l)}">${esc(l)}</button></th>`).join('');
  h += `</tr></thead><tbody>`;
  const hasStarters = ath.some(a => a.starter);
  let section = null;
  const span = labels.length;
  for (const a of ath) {
    if (!sorted && hasStarters) {
      const want = a.starter ? 'Starters' : 'Bench';
      if (want !== section) { section = want; h += `<tr class="div"><th class="pl">${want}</th><td colspan="${span}"></td></tr>`; }
    }
    const p = a.athlete || {};
    const nmText = esc(p.shortName || p.displayName || '');
    const nm = `<th class="pl" scope="row" title="${esc(p.displayName || '')}">${L.sport === 'bb' && p.id ? `<a class="plink" href="${plHref(String(p.id))}" data-pl>${nmText}</a>` : nmText}<span class="pp">${esc(p.position?.abbreviation || '')}</span>${a.ejected ? '<span class="ej">EJ</span>' : ''}</th>`;
    if (!played(a)) {
      h += `<tr class="dnp">${nm}<td class="reason" colspan="${span}">${esc(a.reason || 'Did not play')}</td></tr>`;
      continue;
    }
    h += `<tr>${nm}${labels.map((_, i) => {
      const v = a.stats?.[i] ?? '';
      let cls = '';

async function fetchStandings(league, year) {

function standingsData(year = state.season) {

  const prev = standFor(cy - 1);

function statsSeason(year = state.season) {

    const r = statsFor(year);
    return r.status === 'ok' ? { st: 'ok', map: r.data, year, cur: year === cy } : { st: r.status };
  }
  const cur = statsFor(cy);
  if (cur.status === 'loading') return { st: 'loading' };
  if (cur.status === 'ok' && hasGames(cur.data)) return { st: 'ok', map: cur.data, year: cy, cur: true };
  const prev = statsFor(cy - 1);

// Everyone who played in this or last regular season; this season's numbers win when a player has them.
// One season's players when a season is picked; otherwise this season plus last (this season's numbers win).
function allPlayers(year = state.season) {
  if (year) {
    const r = statsFor(year);
    if (r.status !== 'ok') return { st: r.status };
    const map = new Map();
    for (const [id, x] of r.data) if (x.gp > 0) map.set(id, { ...x, id, year });
    return { st: 'ok', map, latest: year, fixed: true };
  }
  const cy = curSeasonYear();
  const cur = statsFor(cy), prev = statsFor(cy - 1);
  if (cur.status === 'loading' || prev.status === 'loading') return { st: 'loading' };
  if (cur.status !== 'ok' && prev.status !== 'ok') return { st: 'err' };
  const map = new Map();
  for (const [id, r] of prev.data || []) if (r.gp > 0) map.set(id, { ...r, id, year: cy - 1 });
  let anyCur = false;
  for (const [id, r] of cur.data || []) if (r.gp > 0) { map.set(id, { ...r, id, year: cy }); anyCur = true; }
  return { st: 'ok', map, latest: anyCur ? cy : cy - 1 };
}

const fmtLine = v => v == null ? '' : v === 0 ? 'PK' : (v > 0 ? '+' : '') + v;

    <rect x="0" y="0" width="${W}" height="${H}" class="wp-bg"/>${grid}<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" class="wp-mid"/>

  const by = new Map();
  for (const s of shots) { const id = s.athletes[0]; if (id) by.set(id, (by.get(id) || 0) + 1); }
  const sel = state.shotPlayer && by.has(state.shotPlayer) ? state.shotPlayer : '';
  const list = sel ? shots.filter(s => s.athletes[0] === sel) : shots;
  const is3 = s => s.pa === 3 || (s.pa == null && /three point/i.test(s.text));
  const made = s => s.scoring || s.value > 0;
  const zone = s => is3(s) ? 'three' : (Math.abs(s.x - 25) <= 8 && courtY(s.y) <= 19) ? 'paint' : 'mid';
  const z = { paint: [0, 0], mid: [0, 0], three: [0, 0] };
  for (const s of list) { const k = zone(s); z[k][1]++; if (made(s)) z[k][0]++; }
  const marks = list.map(s => {
    const x = s.x, y = courtY(s.y);
    return made(s) ? `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r=".9" class="sh-made" fill="${color}"/>`
      : `<path d="M${(x - .6).toFixed(2)} ${(y - .6).toFixed(2)}l1.2 1.2m0 -1.2l-1.2 1.2" class="sh-miss" stroke="${color}"/>`;
  }).join('');
  const tabs = `<div class="tabs" role="tablist">${[[A, m.a], [B, m.b]].map(([s, c]) => `<button class="tab" type="button" role="tab" data-shotteam="${esc(s.id)}" aria-selected="${tid === s.id}" style="--tc:${c.banner}">${logo(s, 22, tid === s.id)}${esc(s.abbr)}</button>`).join('')}</div>`;
  const opts = [...by.entries()].sort((a, b) => b[1] - a[1]).map(([id, n]) => `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc(names.get(id) || 'Player ' + id)} (${n})</option>`).join('');
  const zt = (k, label) => { const [mk, at] = z[k]; return `<div class="zone"><span>${label}</span><b>${mk}/${at}</b><small>${at ? Math.round(mk / at * 100) + '%' : '–'}</small></div>`; };
  return `<section class="sec"><h2>Shot chart</h2>${tabs}<div class="shot-c"><div class="shot-ctl"><select id="shotPlayer" aria-label="Filter shots by player"><option value="">All players (${shots.length})</option>${opts}</select></div>
    <svg viewBox="-0.5 -0.5 51 48" class="court" role="img" aria-label="${esc(`Shot chart, ${list.filter(made).length} of ${list.length} made`)}">${COURT}${marks}</svg>
    <div class="legend"><span><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="${color}"/></svg> Made</span><span><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6m0-6l-6 6" stroke="${color}" stroke-width="2"/></svg> Missed</span></div>
    <div class="zones">${zt('paint', 'Paint')}${zt('mid', 'Mid-range')}${zt('three', '3-pointers')}</div></div></section>`;
}

function pbpList(pb, e, A, B, m) {
  const periods = [...new Set(pb.plays.map(p => p.period).filter(Boolean))].sort((a, b) => a - b);
  if (!periods.length) return '';
  const n = Math.max(...periods);
  const cur = periods.includes(state.pbpPeriod) ? state.pbpPeriod : periods[periods.length - 1];
  const aHome = A === e.home;
  const list = pb.plays.filter(p => p.period === cur && p.text && (!state.pbpScoring || p.scoring)).sort((a, b) => b.seq - a.seq);
  const col = id => id === A.id ? m.a.bright : id === B.id ? m.b.bright : 'transparent';
  const chips = periods.map(p => `<button class="chip" type="button" data-period="${p}" aria-pressed="${p === cur}">${qLabel(p, n)}</button>`).join('')
    + `<button class="chip" type="button" data-act="pbpScoring" aria-pressed="${state.pbpScoring}">Scoring only</button>`;
  const rows = list.map(p => {
    const sa = aHome ? p.home : p.away, sb = aHome ? p.away : p.home;
    const who = p.team === A.id ? 'a' : p.team === B.id ? 'b' : '';
    return `<div class="pbp-r${p.scoring ? ' sc' : ''}"><span class="pbp-t">${esc(p.clock)}</span><span class="pbp-bar" style="background:${col(p.team)}"></span><span class="pbp-x">${esc(p.text)}</span><span class="pbp-s"><span class="${p.scoring && who === 'a' ? 'hl' : ''}">${esc(sa)}</span>-<span class="${p.scoring && who === 'b' ? 'hl' : ''}">${esc(sb)}</span></span></div>`;
  }).join('');
  return `<section class="sec"><h2>Play-by-play</h2><div class="chips">${chips}</div><div class="pbp">${rows || '<p class="p-note pad">No plays here yet.</p>'}</div><p class="p-note">Newest first · score shown ${esc(A.abbr)}-${esc(B.abbr)}</p></section>`;
}

/* ---------- leaders ---------- */
const LEAD_CATS = [
  { k: 'pts', label: 'Points', unit: 'PPG' }, { k: 'reb', label: 'Rebounds', unit: 'RPG' }, { k: 'ast', label: 'Assists', unit: 'APG' },
  { k: 'stl', label: 'Steals', unit: 'SPG' }, { k: 'blk', label: 'Blocks', unit: 'BPG' }, { k: 'min', label: 'Minutes', unit: 'MPG' },

const hsOf = r => ({ id: r.id, name: r.name, headshot: r.hs });

/* ---------- player search and compare ---------- */
function matchPlayers(map, q, limit) {
  const toks = fold(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return null;
  const starts = r => fold(r.name).split(/[\s-]+/).some(w => w.startsWith(toks[0])) ? 0 : 1;
  return [...map.values()].filter(r => { const hay = fold(`${r.name} ${r.team || ''}`); return toks.every(t => hay.includes(t)); })
    .sort((a, b) => starts(a) - starts(b) || (b.pts ?? 0) - (a.pts ?? 0)).slice(0, limit);
}
function playerLine(r, href, latest, btn = '') {
  const old = r.year !== latest ? `<span class="tag old">${seasonLabel(r.year)}</span>` : '';
  const name = href ? `<a class="stretch" href="${href}">${esc(r.name)}</a>` : esc(r.name);
  return `<div class="lrow lnk-row" style="--tc:${teamColorById(r.teamId).banner}">${headshot(hsOf(r), 'nba')}<span class="lr-name"><b>${name}</b><span>${r.team ? tLink(r.teamId, r.team) : ''}${r.pos ? ` · ${esc(r.pos)}` : ''}${old}</span></span><span class="lr-stats"><span>${f1(r.pts)}<i>PTS</i></span><span>${f1(r.reb)}<i>REB</i></span><span>${f1(r.ast)}<i>AST</i></span></span>${btn}</div>`;
}
function searchView() {
  const auto = state.season ? null : allPlayers(null);
  const picker = seasonPicker('seasonSel', state.season, auto?.st === 'ok' ? auto.latest : curSeasonYear() - 1);
  let h = pageHead('Players', state.season ? `Everyone who played in ${seasonLabel(state.season)}` : 'Everyone from this season and last', picker);
  h += `<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search by name or team" value="${esc(state.q)}" autocomplete="off" spellcheck="false" aria-label="Search players"></div>`;
  h += `<a class="cta-row" href="${hashFor({ view: 'compare' })}"><span><b>Compare two players</b><span>Any two seasons since ${seasonLabel(SEASON_MIN)}, side by side</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`;
  return h + `<div id="qres">${searchResults()}</div>`;
}
// Same games cut-off as Leaders, so a 10-game hot streak doesn't top the list.
const qualified = list => { const mx = Math.max(1, ...list.map(r => r.gp || 0)); return list.filter(r => r.gp >= Math.ceil(mx * 0.7)); };
function searchResults() {
  const ap = allPlayers();
  if (ap.st === 'loading') return skeleton(1);
  if (ap.st !== 'ok') return retryBox("The player list didn't load.");
  if (!ap.map.size) return `<div class="empty"><p class="big">No games yet</p><p>${esc(notStarted(ap.latest))} Pick an earlier season above.</p></div>`;
  const found = matchPlayers(ap.map, state.q, 30);
  if (found === null) {
    const top = qualified([...ap.map.values()].filter(r => r.year === ap.latest)).sort((a, b) => (b.pts ?? 0) - (a.pts ?? 0)).slice(0, 15);
    return `<h2 class="subh">Top scorers · ${seasonLabel(ap.latest)}</h2><div class="lrows">${top.map(r => playerLine(r, plHref(r.id), ap.latest)).join('')}</div>`;
  }
  if (!found.length) return `<p class="p-note">No players match "${esc(state.q)}"${ap.fixed ? ` in ${seasonLabel(ap.latest)}` : ''}.</p>`;
  return `<div class="lrows">${found.map(r => playerLine(r, plHref(r.id), ap.latest)).join('')}</div>`;
}
function cmpSlot(id, yr) {
  if (!id) return { st: 'none' };
  if (yr) {
    const r = statsFor(yr);
    if (r.status !== 'ok') return { st: r.status };
    const x = r.data.get(id);
    return x && x.gp > 0 ? { st: 'ok', p: { ...x, id, year: yr } } : { st: 'missing', year: yr };
  }
  const ap = allPlayers(null);
  if (ap.st !== 'ok') return { st: ap.st };
  const x = ap.map.get(id);
  return x ? { st: 'ok', p: x } : { st: 'missing' };
}
function compareView() {
  const sa = cmpSlot(state.cmpA, state.cmpSeasonA), sb = cmpSlot(state.cmpB, state.cmpSeasonB);
  let h = pageHead('Compare', 'Per-game averages, side by side. Each player can be from any season.');
  if (sa.st === 'loading' || sb.st === 'loading') return h + skeleton(2);
  if (sa.st === 'err' || sb.st === 'err') return h + retryBox("Player stats didn't load.");
  const A = sa.p || null, B = sb.p || null;
  const ta = A && teamsInfo().data?.get(A.teamId), tb = B && teamsInfo().data?.get(B.teamId);
  const m = matchupColors(ta ? { color: ta.color, alt: ta.alt } : null, tb ? { color: tb.color, alt: tb.alt } : null);

  const autoYear = auto.st === 'ok' ? auto.latest : curSeasonYear() - 1;
  const slot = (S, k, c) => {

    }

    return `<div class="cmp-p empty-slot"><span class="hs"></span><b>${S.st === 'missing' ? 'Not that season' : 'Pick a player'}</b><span>${esc(msg)}</span>${yrSel}${S.st === 'missing' ? `<button class="linkbtn" type="button" data-cmpclear="${k}">Change player</button>` : ''}</div>`;
  };

  if (A && B) {

    h += `<div class="ts"><div class="ts-head"><span><span class="cdot" style="background:${m.a.bright}"></span>${esc(A.short || A.name)} · ${seasonLabel(A.year)}</span><span>${esc(B.short || B.name)} · ${seasonLabel(B.year)}<span class="cdot r" style="background:${m.b.bright}"></span></span></div>${rows.map(([label, k, kind]) => {
      if (A[k] == null || B[k] == null) return '';

    }).join('')}</div><p class="p-note">Regular-season averages. The brighter number is the better one.</p>`;
  }
  const picking = !state.cmpA ? 'a' : (!state.cmpB ? 'b' : null);
  if (picking) {
    const yr = picking === 'a' ? state.cmpSeasonA : state.cmpSeasonB;
    h += `<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="cq" type="search" placeholder="Search ${yr ? seasonLabel(yr) + ' players' : 'a player'}" value="${esc(state.cq)}" autocomplete="off" spellcheck="false" aria-label="Search a player to compare"></div><div id="cqres">${compareResults()}</div>`;
  }
  return h;
}
function compareResults() {
  const yr = !state.cmpA ? state.cmpSeasonA : state.cmpSeasonB;

function teamView() {
  const tid = state.teamId, cy = curSeasonYear(), sel = state.season;
  const ti = teamsInfo(), t = ti.data?.get(tid);
  const sd = standingsData(sel);
  let row = null, conf = null;
  if (sd.st === 'ok') for (const c of sd.data.confs) { const r = c.rows.find(x => x.id === tid); if (r) { row = r; conf = c; } }
  if (!t && !row) {
    if (ti.status === 'loading' || sd.st === 'loading') return skeleton(2);
    return retryBox("This team didn't load.");
  }
  const name = t?.full || row?.full || '', abbr = t?.abbr || row?.abbr || '';
  const c = teamColorById(tid), lgo = { abbr, logo: t?.logo || row?.logo || '' };

}

/* ---------- v7: best performances, injuries, playoff picture, head-to-head, more ---------- */
const CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true" class="chev"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const nz = v => { const x = num(v); return x === -Infinity ? 0 : x; };

// John Hollinger's Game Score: one number for a whole stat line
function gameScore(g) {
  const [fgm, fga] = String(g.fg || '').split('-').map(nz), [ftm, fta] = String(g.ft || '').split('-').map(nz);
  return nz(g.pts) + 0.4 * fgm - 0.7 * fga - 0.4 * (fta - ftm) + 0.7 * nz(g.oreb) + 0.3 * nz(g.dreb) + nz(g.stl) + 0.7 * nz(g.ast) + 0.7 * nz(g.blk) - 0.4 * nz(g.pf) - nz(g.to);
}
function feats(g) {
  const tens = ['pts', 'reb', 'ast', 'stl', 'blk'].filter(k => nz(g[k]) >= 10).length;
  const out = [];
  if (tens >= 4) out.push('Quadruple-double'); else if (tens === 3) out.push('Triple-double'); else if (tens === 2) out.push('Double-double');
  if (nz(g.pts) >= 50) out.push('50-point game'); else if (nz(g.pts) >= 40) out.push('40-point game');
  if (nz(g.pts) >= 20 && nz(g.reb) >= 20) out.push('20-20');
  if (nz(g.ast) >= 15) out.push(nz(g.ast) + ' assists');
  if (nz(g.blk) >= 6) out.push(nz(g.blk) + ' blocks');
  return out;
}
function bestPerformances(evs) {
  const games = evs.filter(e => e.state !== 'pre' && !e.preseason);
  if (!games.length) return '';
  const all = [];
  let loading = 0;
  for (const e of games) {
    const s = need(`sum.${e.id}`, () => getJSON(`${API}${LEAGUES.nba.path}/summary?event=${e.id}`), e.state === 'in' ? 90e3 : 0);
    if (s.status === 'loading') { loading++; continue; }
    if (s.status !== 'ok') continue;
    for (const side of [e.away, e.home]) {
      if (!side) continue;
      const opp = side === e.away ? e.home : e.away;
      for (const p of boxPlayers(s.data, side.id) || []) if (p.game) all.push({ p, e, side, opp, gs: gameScore(p.game) });
    }
  }
  if (!all.length) return loading ? `<section class="sec"><h2>Best performances</h2>${skeleton(1)}</section>` : '';
  all.sort((a, b) => b.gs - a.gs);
  const live = games.some(e => e.state === 'in');
  const cards = all.slice(0, 6).map(({ p, e, side, opp, gs }, i) => {
    const g = p.game, c = teamColorById(side.id);
    const badges = feats(g).map(f => `<span class="badge">${esc(f)}</span>`).join('');
    const sub = [`${g.fg} FG`, g.tp && `${g.tp} 3PT`, nz(g.stl) && `${g.stl} STL`, nz(g.blk) && `${g.blk} BLK`, g.pm && `${g.pm}`].filter(Boolean).join(' · ');
    return `<div class="perf lnk-row" style="--tc:${c.banner}"><span class="perf-rank">${i + 1}</span>${headshot(p, 'nba', 'md')}<span class="perf-main"><b><a class="stretch" href="${perfHref(state.day, e.id, p.id)}">${esc(p.name)}</a></b><span class="perf-team">${tLink(side.id, side.abbr)} ${side === e.home ? 'vs' : '@'} ${tLink(opp?.id, opp?.abbr || '')} · <a class="sub-link" href="${gameHref(state.day, e.id)}">${e.state === 'in' ? 'Live game' : 'Box score'}</a></span><span class="perf-line"><strong>${esc(g.pts)}</strong> PTS <strong>${esc(g.reb)}</strong> REB <strong>${esc(g.ast)}</strong> AST</span><span class="perf-sub">${esc(sub)}</span>${badges ? `<span class="badges">${badges}</span>` : ''}</span><span class="perf-gs"><b>${gs.toFixed(1)}</b><i>GmSc</i></span></div>`;
  }).join('');
  return `<section class="sec"><div class="sec-h"><h2>Best performances${live ? ' · so far' : ''}</h2></div><div class="perfs">${cards}</div><p class="p-note">Ranked by Game Score, John Hollinger's one-number summary of a box-score line (about 10 is an average game, 40+ is huge). Tap a player for the full performance.${loading ? ' Still loading some games.' : ''}</p></section>`;
}

    list: (t.injuries || []).map(i => {

      const desc = i.type?.description || '';
      return {
        pid: (href.match(/\/id\/(\d+)/) || [])[1] || '', name: i.athlete?.displayName || '', pos: i.athlete?.position?.abbreviation || '', hs: i.athlete?.headshot?.href || '',
        status: typeof i.status === 'string' ? i.status : desc.replace(/\b\w/g, ch => ch.toUpperCase()),

      const ret = i.ret && Date.parse(i.ret) > now ? `Expected back ${fmtDayLong.format(new Date(i.ret))}` : '';

/* playoff picture */
const SEASON_GAMES = 82;
function raceFor(rows) {
  return new Map(rows.map(a => {
    const w = a.w || 0, l = a.l || 0, left = SEASON_GAMES - w - l, ceil = SEASON_GAMES - l;
    const others = rows.filter(b => b !== a);
    const ceilings = others.map(b => SEASON_GAMES - (b.l || 0)).sort((x, y) => y - x);
    const status = k => {
      if (others.filter(b => (b.w || 0) > ceil).length >= k) return { t: 'out' };
      const c = ceilings[k - 1];
      const n = c == null ? 0 : Math.max(0, c + 1 - w);
      if (n === 0) return { t: 'in' };
      return n > left ? { t: 'help' } : { t: 'need', n };
    };
    return [a.id, { top6: status(6), top10: status(10) }];
  }));
}
function raceCell(s) {
  if (s.t === 'in') return '<span class="race in">Clinched</span>';
  if (s.t === 'out') return '<span class="race out">Out</span>';
  if (s.t === 'help') return '<span class="race help">Needs help</span>';
  return `<span class="race need">${s.n} W</span>`;
}
function bracketTeam(r, seedLabel) {
  if (!r) return `<div class="bt tbd"><span class="bt-seed">${esc(seedLabel)}</span><span class="bt-name">TBD</span></div>`;
  return `<a class="bt" href="${teamHref(r.id)}" style="--tc:${teamColorById(r.id).bright}"><span class="bt-seed">${esc(seedLabel)}</span>${logo({ abbr: r.abbr, logo: r.logo }, 22)}<span class="bt-name">${esc(r.abbr)}</span><span class="bt-rec">${r.w ?? 0}-${r.l ?? 0}</span></a>`;
}
function playoffsView() {
  const sd = standingsData(null);
  let h = pageHead('Playoff picture', 'Seeds, play-in and first round');
  if (sd.st === 'loading') return h + skeleton(3);

  h = pageHead('Playoff picture', live ? `${seasonLabel(sd.year)} · if the season ended today` : `How ${seasonLabel(sd.year)} finished · ${seasonLabel(sd.year + 1)} fills in once games are played`);
  const playIn = sd.year >= 2021;
  for (const c of sd.data.confs) {
    const rows = c.rows.filter(r => r.seed > 0);
    if (!rows.length) continue;
    const S = n => rows.find(r => r.seed === n);
    let b = '';
    if (playIn) {

const clamp01 = v => Math.max(0, Math.min(1, v));
// What the ranking knows about each team: how good it is, who its best scorers are, who is out.
function watchInputs() {
  const cy = curSeasonYear();
  const cur = standFor(cy), prev = standFor(cy - 1);
  const sc = statsFor(cy), sp = statsFor(cy - 1);
  const inj = need('injuries.nba', fetchInjuries, 15 * 60e3);
  const loading = [cur, prev, sc, sp].some(r => r.status === 'loading');
  const rowsOf = r => r.status === 'ok' ? new Map(r.data.confs.flatMap(c => c.rows.map(x => [x.id, x]))) : new Map();
  const curRows = rowsOf(cur), prevRows = rowsOf(prev);
  // team strength: this season's average margin once a team has 10+ games, before that last season's
  const quality = id => {
    const c = curRows.get(id);
    if (c && (c.w || 0) + (c.l || 0) >= 10 && c.diff != null) return { d: c.diff, src: seasonLabel(cy) };
    const p = prevRows.get(id);
    return p && p.diff != null ? { d: p.diff, src: seasonLabel(cy - 1) } : null;
  };
  // star power: this season's scoring once the league has 15+ games, before that last season's scoring
  // with each player placed on the team he plays for now
  const curMap = sc.status === 'ok' ? sc.data : new Map(), prevMap = sp.status === 'ok' ? sp.data : new Map();
  const useCur = Math.max(0, ...[...curMap.values()].map(r => r.gp || 0)) >= 15;
  const out = new Set();
  if (inj.status === 'ok') for (const t of inj.data) for (const i of t.list) if (i.pid && isOut(i.status)) out.add(i.pid);
  const byTeam = new Map();
  const add = (id, r, teamId) => { if (!teamId || r.pts == null) return; if (!byTeam.has(teamId)) byTeam.set(teamId, []); byTeam.get(teamId).push({ id, name: r.short || r.name, full: r.name, pts: r.pts, out: out.has(id) }); };
  if (useCur) { for (const [id, r] of curMap) if (r.gp >= 3) add(id, r, r.teamId); }
  else for (const [id, r] of prevMap) if (r.gp >= 20) { const now = curMap.get(id); add(id, r, now && now.gp > 0 ? now.teamId : r.teamId); }
  for (const list of byTeam.values()) list.sort((a, b) => b.pts - a.pts);
  const stars = id => (byTeam.get(id) || []).slice(0, 4);
  return { loading, quality, stars, starSrc: useCur ? seasonLabel(cy) : seasonLabel(cy - 1) };
}
function watchScore(e, inp) {

  const qa = inp.quality(e.away?.id), qh = inp.quality(e.home?.id);
  const qn = q => q ? clamp01((q.d + 10) / 20) : 0.5;
  const quality = (qn(qa) + qn(qh)) / 2;
  const playing = list => list.filter(p => !p.out);
  const sa = playing(inp.stars(e.away?.id)), sh = playing(inp.stars(e.home?.id));
  const sn = list => list.length ? clamp01((list[0].pts - 15) / 17) * 0.7 + clamp01(((list[1]?.pts ?? 0) - 12) / 14) * 0.3 : 0.3;

    else if (m >= 20) { score -= 2; live = `${m}-point blowout`; }

  const missing = [...inp.stars(e.away?.id).slice(0, 2), ...inp.stars(e.home?.id).slice(0, 2)].filter(p => p.out);

      changed = true;
    } else if (/postpon|cancel/i.test(e.short)) { x.res = 'V'; changed = true; }
  }
  return changed;
}
let settling = false;
// Grades finished picks: from scoreboards already loaded, then by fetching days still waiting for a result.
async function settlePicks() {
  if (settling) return;
  settling = true;
  try {
    const p = picksAll();
    let changed = false;
    for (const [k, b] of boards) if (k.startsWith('nba/')) changed = settleFrom(b, p) || changed;
    const waiting = Object.values(p).filter(x => !x.res && x.date && Date.parse(x.date) < Date.now() - 2.5 * 3600e3);
    for (const day of [...new Set(waiting.map(x => x.day))].slice(0, 10)) {
      const b = await getJSON(`${API}${LEAGUES.nba.path}/scoreboard?dates=${day}`).catch(() => null);
      if (b) changed = settleFrom(b, p) || changed;
    }
    for (const x of Object.values(p)) if (!x.res && x.date && Date.parse(x.date) < Date.now() - 5 * 864e5) { x.res = 'V'; changed = true; }
    if (changed) { savePicks(p); renderMain(); }
  } finally { settling = false; }
}
function pickStats() {
  const all = Object.values(picksAll());
  const done = all.filter(x => x.res === 'W' || x.res === 'L').sort((a, b) => Date.parse(a.date) - Date.parse(b.date) || String(a.gid).localeCompare(String(b.gid)));
  let run = 0, best = 0;
  for (const x of done) { if (x.res === 'W') { run++; best = Math.max(best, run); } else run = 0; }
  const wins = done.filter(x => x.res === 'W').length;
  return { cur: run, best, wins, losses: done.length - wins, total: done.length, pending: all.filter(x => !x.res).length };
}
const streakWord = n => `${n} in a row`;
// The pick panel on a game page
function pickBlock(e, A, B, m) {
  if (e.preseason || !A || !B) return '';
  const p = picksAll()[e.id];
  const st = pickStats();
  const locked = pickLocked(e);
  if (!locked) {
    const btn = (s, c) => { const on = !!p && p.team === s.id; return `<button type="button" class="pk-btn${on ? ' on' : ''}" data-pick-team="${esc(s.id)}" data-gid="${esc(e.id)}" style="--tc:${c.banner}" aria-pressed="${on}">${logo(s, 30, on)}<b>${esc(s.abbr)}</b><span>${on ? 'Picked' : 'Pick'}</span></button>`; };
    const dt = e.date ? new Date(e.date) : null;
    return `<section class="pick"><div class="pick-h"><b>Pick the winner</b><span>${dt ? `Locks at tip-off, ${esc(fmtLocalTime.format(dt))}` : 'Locks at tip-off'}</span></div><div class="pk-row">${btn(A, m.a)}${btn(B, m.b)}</div><div class="pick-foot"><span>Streak <b>${st.cur}</b></span><span>Best <b>${st.best}</b></span><a href="${hashFor({ view: 'picks', day: state.day })}">All picks ›</a></div></section>`;
  }
  if (!p) return e.state === 'pre' ? '' : `<section class="pick quiet"><div class="pick-h"><b>Pick the winner</b><span>Picks closed at tip-off. You didn't pick this one.</span></div></section>`;
  const mine = p.team === e.home.id ? e.home : e.away, other = mine === e.home ? e.away : e.home;
  let line, cls = '';
  if (p.res === 'W' || p.res === 'L' || (e.state === 'post' && e.completed)) {
    const won = p.res ? p.res === 'W' : mine.winner;
    cls = won ? 'good' : 'bad';
    line = `${won ? 'Correct' : 'Wrong'}. Current streak ${st.cur}, best ${st.best}.`;
  } else if (e.state === 'in') {
    const d = nz(mine.score) - nz(other.score);
    line = d > 0 ? `${mine.abbr} up ${d}` : d < 0 ? `${mine.abbr} down ${-d}` : 'Tied';
  } else line = 'Locked in. Waiting for tip-off.';
  return `<section class="pick ${cls}"><div class="pick-h"><b>Your pick: ${esc(mine.abbr)}</b><span>${esc(line)}</span></div></section>`;
}
// Badge on a game card
function pickBadge(e) {
  const p = picksAll()[e.id];
  if (!p) return '';
  const r = p.res === 'W' ? ' · correct' : p.res === 'L' ? ' · wrong' : '';
  return `<span class="pk-badge${p.res === 'W' ? ' good' : p.res === 'L' ? ' bad' : ''}">Your pick: ${esc(p.abbr)}${r}</span>`;
}
function picksStrip(evs) {
  const open = evs.filter(e => !e.preseason && !pickLocked(e));
  const st = pickStats();
  if (!open.length && !st.total && !st.pending) return '';
  const p = picksAll();
  const left = open.filter(e => !p[e.id]).length;
  const sub = open.length ? (left ? `${left} game${left > 1 ? 's' : ''} left to pick` : 'All picked for this day') : `Record ${st.wins}-${st.losses}`;
  return `<a class="pk-strip" href="${hashFor({ view: 'picks', day: state.day })}"><span class="pk-streak"><b>${st.cur}</b><i>streak</i></span><span class="wg-strip-t"><b>Pick the winner</b><span>${esc(sub)} · best ${st.best}</span></span>${CHEV}</a>`;
}
function picksView() {
  const L = LEAGUES.nba;
  const st = pickStats();
  const acc = st.total ? Math.round(st.wins / st.total * 100) + '%' : '–';
  let h = pageHead('Pick the winner', 'Pick before tip-off. Every correct pick adds to your streak, a wrong one resets it.');
  h += `<div class="tiles pk-tiles"><div class="tile hot"><b>${st.cur}</b><span>STREAK</span></div><div class="tile"><b>${st.best}</b><span>BEST</span></div><div class="tile"><b>${st.wins}-${st.losses}</b><span>RECORD</span></div><div class="tile"><b>${acc}</b><span>CORRECT</span></div></div>`;
  const board = boards.get(boardKey());
  const cal = calendars.get('nba');
  const days = cal ? [...cal].sort() : [];
  const prev = [...days].reverse().find(d => d < state.day), next = days.find(d => d > state.day);
  h += `<div class="pk-day"><button class="arr" type="button" data-pkday="${prev || ''}" aria-label="Previous game day"${prev ? '' : ' disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><b>${esc(fmtDayLong.format(dayToDate(state.day)))}</b><button class="arr" type="button" data-pkday="${next || ''}" aria-label="Next game day"${next ? '' : ' disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>`;
  if (!board) h += state.error ? errorBox() : skeleton(2);
  else {
    const evs = (board.events || []).map(parseEvent).filter(e => !e.preseason).sort((a, b) => Date.parse(a.date) - Date.parse(b.date));
    if (!evs.length) h += `<p class="p-note">No games on this day.</p>`;
    else h += `<div class="pk-list">${evs.map(e => {
      const [A, B] = ordered(e, L), m = matchupColors(A, B);
      const p = picksAll()[e.id], locked = pickLocked(e);
      const dt = e.date ? new Date(e.date) : null;
      const side = (s, c) => {
        const on = !!p && p.team === s.id;
        const res = on && p.res ? (p.res === 'W' ? ' good' : p.res === 'L' ? ' bad' : '') : '';
        return `<button type="button" class="pk-btn${on ? ' on' : ''}${res}" data-pick-team="${esc(s.id)}" data-gid="${esc(e.id)}" style="--tc:${c.banner}" aria-pressed="${on}"${locked ? ' disabled' : ''}>${logo(s, 26, on)}<b>${esc(s.abbr)}</b>${e.state !== 'pre' ? `<span class="pk-sc">${esc(s.score)}</span>` : ''}</button>`;
      };
      let status;
      if (!locked) status = dt ? `<span>${esc(fmtLocalWk.format(dt) + ' ' + fmtLocalTime.format(dt))}</span><span data-countdown="${dt.getTime()}">${esc(countdown(dt.getTime()))}</span>` : '<span>Time TBD</span>';
      else if (e.state === 'in') status = `<span class="pill live mini"><i></i>${esc(statusText(e, L))}</span>`;
      else if (e.state === 'post') status = `<span>${esc(statusText(e, L))}</span>`;
      else status = '<span>Locked</span>';
      let verdict = '';
      if (p && (p.res === 'W' || p.res === 'L')) verdict = `<span class="pk-v ${p.res === 'W' ? 'good' : 'bad'}">${p.res === 'W' ? 'Correct' : 'Wrong'}</span>`;
      else if (!p && locked) verdict = '<span class="pk-v">No pick</span>';
      else if (p && locked) verdict = '<span class="pk-v">Locked</span>';
      return `<div class="pk-game"><div class="pk-top">${status}${verdict}<a class="pk-open" href="${gameHref(state.day, e.id)}">Game ›</a></div><div class="pk-row">${side(A, m.a)}<span class="pk-at">${e.home === A ? 'vs' : '@'}</span>${side(B, m.b)}</div></div>`;
    }).join('')}</div>`;
  }
  // history across all days
  const hist = Object.values(picksAll()).sort((a, b) => Date.parse(b.date) - Date.parse(a.date)).slice(0, 30);
  if (hist.length) {
    h += `<section class="sec"><h2>Your picks</h2><div class="srows">${hist.map(x => {
      const dt = new Date(x.date);
      const res = x.res === 'W' ? '<span class="sr-res w">W</span>' : x.res === 'L' ? '<span class="sr-res l">L</span>' : '<span class="sr-res"></span>';
      return `<a class="srow" href="${gameHref(x.day, x.gid)}"><span class="sched-date">${esc(fmtLocalWk.format(dt))} ${esc(fmtDM.format(dt))}</span><span class="sr-opp">${esc(x.abbr)}<i>${x.home ? 'vs' : '@'}</i>${esc(x.oppAbbr)}</span>${res}<span class="sr-score">${x.res === 'W' ? 'Correct' : x.res === 'L' ? 'Wrong' : x.res === 'V' ? 'Void' : 'Pending'}</span></a>`;
    }).join('')}</div><p class="p-note">Picks are saved on this phone only. Postponed games don't count either way.</p></section>`;
  }
  return h;
}

/* ---------- events ---------- */
// a tab switched from a link further down the page scrolls back up to the tabs
function toTabs(btn) {
  if (btn.closest('.seg')) return;
  const seg = $('#main .seg'), bar = document.querySelector('.bar');
  if (seg) window.scrollTo(0, Math.max(0, seg.getBoundingClientRect().top + window.scrollY - (bar ? bar.offsetHeight : 0) - 10));
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#/"]');
  if (a) {
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
    ev.preventDefault();
    const h = a.getAttribute('href');
    if (h === location.hash) { window.scrollTo(0, 0); return; }
    setHash(h, true);
    return;
  }
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.pickTeam) { makePick(t.dataset.gid, t.dataset.pickTeam); return; }
  if (t.dataset.pkday) { setHash(hashFor({ view: 'picks', day: t.dataset.pkday }), false); return; }
  if (t.dataset.oddsfmt) { state.oddsFmt = t.dataset.oddsfmt; store.set('oddsFmt', state.oddsFmt); renderMain(); return; }
  if (t.dataset.ttab) { state.tabs['t' + state.teamId] = t.dataset.ttab; renderMain(); toTabs(t); return; }
  if (t.dataset.ptab) { state.tabs['p' + state.playerId] = t.dataset.ptab; renderMain(); toTabs(t); return; }
  if (t.dataset.glyear) { state.glSeason = +t.dataset.glyear; state.tabs['p' + state.playerId] = 'log'; renderMain(); toTabs(t); return; }
  if (t.dataset.injf) { state.injFilter = t.dataset.injf; renderMain(); return; }
  if (t.id === 'nbaOnly' || t.id === 'nbaOnly2') {
    state.nbaOnly = !state.nbaOnly;
    store.set('nbaOnly', state.nbaOnly);
    if (state.nbaOnly && state.league !== 'nba') setHash(hashFor({ league: 'nba', view: 'scores', day: state.day }), false);
    else render();
    return;
  }
  if (t.id === 'back' || t.dataset.act === 'back') { goBack(); return; }
  if (t.id === 'calBtn') {
    const inp = $('#dayInput');
    inp.value = `${state.day.slice(0, 4)}-${state.day.slice(4, 6)}-${state.day.slice(6, 8)}`;
    try { inp.showPicker(); } catch (e) { inp.focus(); inp.click(); }
    return;
  }
  if (t.dataset.act === 'refresh') { load(); return; }
  if (t.dataset.day) { setHash(hashFor({ view: 'scores', day: t.dataset.day }), false); return; }
  if (t.dataset.shift) { setHash(hashFor({ view: 'scores', day: addDays(state.day, +t.dataset.shift) }), false); return; }
  if (t.dataset.league) { store.set('league', t.dataset.league); setHash(hashFor({ league: t.dataset.league, view: 'scores', day: state.day }), false); return; }
  if (t.dataset.team) { state.boxTeam = t.dataset.team; renderMain(); return; }
  if (t.dataset.gtab) { state.gameTab = t.dataset.gtab; renderMain(); if (t.dataset.gtab === 'plays') ensurePlays(); return; }
  if (t.dataset.pteam) { state.pTeam = t.dataset.pteam; renderMain(); return; }
  if (t.dataset.act === 'retryPlayers') { for (const [k, v] of res) if (v.status === 'err') res.delete(k); renderMain(); return; }
  if (t.dataset.lcat) { state.leadCat = t.dataset.lcat; store.set('leadCat', state.leadCat); renderMain(); return; }
  if (t.dataset.setfav != null) { state.fav = t.dataset.setfav || null; store.set('fav', state.fav); goBack(); return; }
  if (t.dataset.togglefav) { state.fav = state.fav === t.dataset.togglefav ? null : t.dataset.togglefav; store.set('fav', state.fav); renderMain(); return; }
  if (t.dataset.pick) {
    const r = { view: 'compare', cmpA: state.cmpA, cmpB: state.cmpB };
    if (!r.cmpA) r.cmpA = t.dataset.pick; else r.cmpB = t.dataset.pick;
    state.cq = '';
    setHash(hashFor(r), false);
    return;
  }
  if (t.dataset.cmpclear) {
    const r = { view: 'compare', cmpA: state.cmpA, cmpB: state.cmpB };
    if (t.dataset.cmpclear === 'a') { r.cmpA = r.cmpB; r.cmpB = null; } else r.cmpB = null;
    setHash(hashFor(r), false);
    return;
  }
  if (t.dataset.shotteam) { state.shotTeam = t.dataset.shotteam; state.shotPlayer = ''; renderMain(); return; }
  if (t.dataset.period) { state.pbpPeriod = +t.dataset.period; renderMain(); return; }
  if (t.dataset.act === 'pbpScoring') { state.pbpScoring = !state.pbpScoring; renderMain(); return; }
  if (t.dataset.c != null && t.dataset.g != null) {
    const g = +t.dataset.g, c = +t.dataset.c;
    const s = state.sort;
    state.sort = s && s.g === g && s.col === c && s.team === state.boxTeam ? null : { g, col: c, team: state.boxTeam };
    renderMain();
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { state.q = t.value; const r = $('#qres'); if (r) r.innerHTML = searchResults(); }
  if (t.id === 'cq') { state.cq = t.value; const r = $('#cqres'); if (r) r.innerHTML = compareResults(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, v = t.value ? +t.value : null;
  if (t.id === 'shotPlayer') { state.shotPlayer = t.value; renderMain(); }
  if (t.id === 'compactToggle') { state.compact = t.checked; store.set('compact', state.compact); renderMain(); }
  if (t.id === 'seasonSel') { state.season = v; renderMain(); }
  if (t.id === 'cmpSeasonA') { state.cmpSeasonA = v; renderMain(); }
  if (t.id === 'cmpSeasonB') { state.cmpSeasonB = v; renderMain(); }
  if (t.id === 'glSeason') { state.glSeason = v; renderMain(); }
  if (t.id === 'h2hA' || t.id === 'h2hB') {
    const a = t.id === 'h2hA' ? t.value || null : (state.h2hA || state.fav || null), b = t.id === 'h2hB' ? t.value || null : state.h2hB;
    setHash(hashFor({ view: 'h2h', h2hA: a, h2hB: a ? b : null }), false);
  }
});
$('#dayInput').addEventListener('change', e => {
  const v = e.target.value;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) setHash(hashFor({ view: 'scores', day: v.replace(/-/g, '') }), false);
});
document.addEventListener('error', ev => {
  const img = ev.target;
  if (!(img instanceof HTMLImageElement)) return;
  const rest = (img.dataset.fb || '').split('|').filter(Boolean);
  if (rest.length) { img.dataset.fb = rest.slice(1).join('|'); img.src = rest[0]; } else img.remove();
}, true);
setInterval(() => {
  document.querySelectorAll('[data-countdown]').forEach(el => { el.textContent = countdown(+el.dataset.countdown); });
}, 30000);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* app still works without offline support */ });
try { history.scrollRestoration = 'manual'; } catch (e) { /* older browsers */ }
applyRoute(false);
})();
