<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courtside</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B0E13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column of game cards under a sticky bar (name, NBA-only switch, 7-day strip). A game opens as its own view: score header, linescore, player box per team, team stats. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E7EAF0; --line:#DADFE7;
  --fg:#10151E; --muted:#576072; --faint:#8A92A1;
  --accent:#D4470C; --on-accent:#FFFFFF; --accent-soft:#FBE3D6;
  --live:#D3243A; --good:#1B8452; --bad:#C2323A; --warn:#A86B0C;
  --logo-bg:transparent; --shadow:0 1px 2px rgba(16,21,30,.06);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E13; --surface:#141922; --surface-2:#1C2330; --line:#252D3A;
    --fg:#ECEFF4; --muted:#9BA4B4; --faint:#687285;
    --accent:#FF7A33; --on-accent:#1A0D05; --accent-soft:#3A2214;
    --live:#FF4B5C; --good:#41C68B; --bad:#FF6E76; --warn:#F2B544;
    --logo-bg:#E4E8EE; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#141922; --surface-2:#1C2330; --line:#252D3A;
  --fg:#ECEFF4; --muted:#9BA4B4; --faint:#687285;
  --accent:#FF7A33; --on-accent:#1A0D05; --accent-soft:#3A2214;
  --live:#FF4B5C; --good:#41C68B; --bad:#FF6E76; --warn:#F2B544;
  --logo-bg:#E4E8EE; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{font:700 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;display:flex;align-items:baseline;gap:8px}
.brand small{font:600 11px/1 var(--f-body);letter-spacing:.12em;color:var(--accent)}
.switch{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:9px;font:600 13px/1 var(--f-body);cursor:pointer;padding:6px 0}
.sw-track{width:38px;height:22px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s,border-color .2s;flex:none}
.sw-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:transform .2s,background .2s}
.switch[aria-pressed="true"] .sw-track{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"] .sw-knob{transform:translateX(16px);background:var(--on-accent)}

.dates{display:flex;align-items:center;gap:4px;padding-block:4px 10px}
.arr,.cal{appearance:none;border:0;background:none;width:34px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.arr:hover,.cal:hover{background:var(--surface-2);color:var(--fg)}
.arr svg,.cal svg{width:18px;height:18px}
.strip{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{appearance:none;border:0;background:transparent;border-radius:10px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.day:hover{background:var(--surface-2)}
.day .wk{font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.day .dn{font:600 21px/1 var(--f-display);font-variant-numeric:tabular-nums}
.day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day.off .dn{color:var(--faint);font-weight:500}
.day.off .dot{visibility:hidden}
.day.today .wk{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.sel .wk{color:inherit;opacity:.85}
.day.sel .dn{color:inherit}
.day.sel .dot{background:currentColor}
.sr-date{position:absolute;right:16px;top:60px;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}

.leagues{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.leagues::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:500 13px/1 var(--f-body);white-space:nowrap;cursor:pointer;flex:none}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.gamebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:4px 10px}
.back{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:4px;font:600 14px/1 var(--f-body);cursor:pointer;padding:8px 8px 8px 0;color:var(--fg)}
.back svg{width:18px;height:18px}
.gamebar span{font:500 12.5px/1.2 var(--f-body);color:var(--faint);text-align:right}

/* list */
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 12px}
.dayhead h1{font:700 30px/1 var(--f-display);margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.dayhead p{margin:0;color:var(--faint);font-size:12.5px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font:500 13px/1 var(--f-body);cursor:pointer;color:var(--fg)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.games{display:grid;gap:10px}
@media (min-width:660px){.games{grid-template-columns:1fr 1fr}}
.lg{width:30px;height:30px;border-radius:50%;background:var(--logo-bg);display:grid;place-items:center;overflow:hidden;flex:none}
.lg img{width:80%;height:80%;object-fit:contain}
.lg:empty{background:var(--surface-2)}
.lg:empty::after{content:attr(data-ab);font:700 11px/1 var(--f-display);color:var(--muted)}

/* matchup banners: away colour on the left melting into home colour on the right; same look in both themes */
.game,.gh,.ph,.favstrip,.lead-hero{
  --ca:#2B313C;--cb:#2B313C;--ca2:#6C7484;--cb2:#6C7484;
  position:relative;color:#FFFFFF;overflow:hidden;background-color:var(--ca);
  background-image:
    radial-gradient(70% 120% at 0% 0%,color-mix(in srgb,var(--ca2) 30%,transparent),transparent 65%),
    radial-gradient(70% 120% at 100% 0%,color-mix(in srgb,var(--cb2) 30%,transparent),transparent 65%),
    radial-gradient(40% 90% at 50% 55%,rgba(0,0,0,.24),transparent 75%),
    linear-gradient(100deg,var(--ca) 0%,var(--ca) 20%,var(--cb) 80%,var(--cb) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 10px 22px -14px rgba(0,0,0,.55);
}
.game{display:block;text-decoration:none;border-radius:16px;padding:14px 10px 12px;transition:transform .15s,filter .15s;min-width:0}
.game:hover{transform:translateY(-1px);filter:brightness(1.06)}
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.side .lg{width:44px;height:44px;background:transparent;border-radius:0;overflow:visible;margin-bottom:2px}
.side .lg img{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.side .lg:empty{background:rgba(255,255,255,.16);border-radius:50%}
.side .lg:empty::after{color:#FFFFFF;font-size:15px}
.side .ab{font:700 21px/1 var(--f-display);letter-spacing:.03em}
.side .nm{font-size:12.5px;color:rgba(255,255,255,.9);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .rec{font:500 11.5px/1 var(--f-data);color:rgba(255,255,255,.86);font-variant-numeric:tabular-nums}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding-inline:2px}
.score{font:700 36px/1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;text-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.score .dash{font-weight:500;font-size:20px;color:rgba(255,255,255,.6)}
.score .lose{color:rgba(255,255,255,.6)}
.kick-day{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.88)}
.kick{font:700 30px/1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.34);color:#FFFFFF;border-radius:999px;padding:5px 9px;font:600 11px/1 var(--f-body);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.pill.live i{width:7px;height:7px;border-radius:50%;background:#FF5A6E;animation:pulse 1.4s ease-in-out infinite}
.tv2{font:500 10.5px/1.2 var(--f-body);color:rgba(255,255,255,.86);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extra{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:9px;border-top:1px solid rgba(255,255,255,.18);font:500 12.5px/1.3 var(--f-data);color:rgba(255,255,255,.9)}
.extra+.extra{margin-top:0;border-top:0;padding-top:4px}
.extra b{color:#FFFFFF;font-weight:600}
.extra .r{text-align:right}
.extra .c{flex:1 1 100%;text-align:center}

.empty{text-align:center;padding:44px 12px 24px;color:var(--muted)}
.empty .big{font:700 24px/1.1 var(--f-display);color:var(--fg);text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px}
.empty p{margin:0 0 18px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.err{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
.err b{font-weight:600}
.err p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.err p:first-child{color:var(--fg)}
.note{background:var(--accent-soft);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.sk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.sk i{display:block;height:14px;border-radius:6px;background:var(--surface-2);animation:sh 1s ease-in-out infinite alternate}
.sk i:nth-child(2){width:80%}
.sk i:nth-child(3){width:55%}

/* game view */
.gh{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;border-radius:20px;padding:26px 10px 22px;margin-top:14px}
.gh .side .lg{width:66px;height:66px;margin-bottom:4px}
.gh .side .ab{font-size:27px}
.gh .side .nm{font-size:13.5px}
.gh .score{font-size:58px;gap:10px}
.gh .score .dash{font-size:28px}
.gh .kick{font-size:40px}
.gh .mid{gap:8px}
.gh-meta{color:var(--faint);font-size:12.5px;text-align:center;margin:10px 0 0}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:0}
.cdot.r{margin:0 0 0 8px}
@media (max-width:380px){.gh .score{font-size:46px;gap:6px}.gh .side .lg{width:52px;height:52px}.score{font-size:32px}.side .lg{width:38px;height:38px}}

.sec{margin-top:24px}
.sec h2{font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.ls{width:100%;font-size:14px}
.ls th,.ls td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
.ls tr:last-child>*{border-bottom:0}
.ls thead th{font-size:11.5px;color:var(--faint);font-weight:500}
.ls tbody th{text-align:left;font:700 17px/1 var(--f-display);letter-spacing:.02em}
.ls .tot{font-weight:600;background:var(--surface-2)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:10px}
.tab{appearance:none;border:0;background:transparent;border-radius:9px;padding:9px 8px;font:700 18px/1 var(--f-display);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;letter-spacing:.03em}
.tab .lg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--tc,var(--accent));color:#FFFFFF;box-shadow:0 2px 8px -4px rgba(0,0,0,.5)}
.tab[aria-selected="true"] .lg{background:transparent}
.tab:disabled{opacity:.45;cursor:default}
.grp{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 8px}
.grp:first-child{margin-top:0}
.box{min-width:100%;font-size:13.5px}
.box th,.box td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.box thead th{font-weight:500;color:var(--faint);font-size:11.5px;padding:0}
.box .sort{appearance:none;border:0;background:none;color:inherit;padding:10px 8px;cursor:pointer;width:100%;text-align:right;letter-spacing:.03em;font:inherit}
.box .sort.on{color:var(--accent);font-weight:600}
.box .sort.on::after{content:" \2193"}
.box .pl{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;box-shadow:inset -1px 0 0 var(--line);min-width:132px;max-width:170px}
.box thead th.pl{padding:10px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.box tbody th.pl{font:500 14px/1.2 var(--f-body);padding-left:10px;overflow:hidden;text-overflow:ellipsis}
.pp{color:var(--faint);font:500 11px/1 var(--f-data);margin-left:6px}
.ej{color:var(--bad);font:600 10px/1 var(--f-body);margin-left:6px;letter-spacing:.05em}
.box td.pts{font-weight:600}
.box td.hot{color:var(--accent);font-weight:600}
.box tr.div th,.box tr.div td{background:var(--surface-2);font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:7px 10px;text-align:left}
.box tr.dnp th.pl{color:var(--muted)}
.box tr.dnp td.reason{text-align:left;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.box tr.tot th,.box tr.tot td{font-weight:600;background:var(--surface-2);border-bottom:0}
.box tr.tot th.pl{font-weight:600}
.box tr:last-child>*{border-bottom:0}
.pm-pos{color:var(--good)}
.pm-neg{color:var(--bad)}
.hint{color:var(--faint);font-size:12px;margin:8px 2px 0}

.ts{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;box-shadow:var(--shadow)}
.ts-head{display:flex;justify-content:space-between;font:700 15px/1 var(--f-display);letter-spacing:.04em;padding:10px 0 4px;color:var(--muted)}
.ts-row{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) minmax(70px,auto);align-items:center;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ts-row:last-child{border-bottom:0}
.ts-v{font:600 15px/1.15 var(--f-data);font-variant-numeric:tabular-nums;color:var(--muted)}
.ts-v.h{text-align:right}
.ts-v.lead{color:var(--fg)}
.ts-v small{display:block;font-weight:400;font-size:11.5px;color:var(--faint)}
.ts-l{text-align:center;font-size:12.5px;color:var(--muted)}
.split{grid-column:1/-1;display:flex;gap:3px;height:5px}
.split i{display:block;border-radius:3px;min-width:3px}

/* win probability */
.wp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin-top:12px;box-shadow:var(--shadow)}
.wp-title{font:700 13px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:10px}
.wp-pct{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.wp-pct small{font:600 11px/1 var(--f-body);letter-spacing:.06em;color:var(--muted)}
.wp-bar{display:flex;gap:3px;height:10px}
.wp-bar i{display:block;border-radius:5px;min-width:4px}
.wp-src{margin:8px 0 0;font-size:11.5px;line-height:1.4;color:var(--faint)}
.wpx{align-items:center}
.wpmini{flex:1;display:flex;gap:3px;height:6px;margin-inline:10px}
.wpmini i{display:block;border-radius:3px;min-width:3px;background:rgba(255,255,255,.92)}
.wpmini i:last-child{background:rgba(255,255,255,.38)}

/* game sub-tabs */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-top:16px}
.seg-b{appearance:none;border:0;background:transparent;border-radius:9px;padding:10px 8px;font:600 14px/1 var(--f-body);color:var(--muted);cursor:pointer}
.seg-b[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line),var(--shadow)}

/* players */
.p-note{font-size:12.5px;line-height:1.4;color:var(--faint);margin:2px 2px 10px}
.p-note b{color:var(--muted);font-weight:600}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
.plist{display:grid;gap:8px}
@media (min-width:660px){.plist{grid-template-columns:1fr 1fr}}
.pcard{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.hs{width:60px;height:60px;border-radius:50%;background:var(--tc,var(--surface-2));overflow:hidden;display:block;position:relative}
.hs img{width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% 0}
.hs:empty::after{content:attr(data-in);position:absolute;inset:0;display:grid;place-items:center;font:700 20px/1 var(--f-display);color:#FFFFFF}
.pc-main{min-width:0}
.pc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pc-name{font:700 19px/1.1 var(--f-display);letter-spacing:.02em}
.pc-meta{font:500 12px/1.3 var(--f-data);color:var(--faint);margin-top:2px}
.tag{font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:3px 5px}
.tag.out{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tag.gtd{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tag.old{background:var(--surface-2);color:var(--muted)}
.avg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px;margin-top:9px}
.avg span{display:flex;flex-direction:column;gap:3px;min-width:0}
.avg b{font:700 18px/1 var(--f-display);font-variant-numeric:tabular-nums}
.avg i{font:600 9.5px/1 var(--f-body);font-style:normal;letter-spacing:.08em;color:var(--faint)}
.tonight{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}

.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.zone{background:var(--surface-2);border-radius:10px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0}
.zone span{font:600 10px/1 var(--f-body);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.zone b{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.zone small{font:500 12px/1 var(--f-data);color:var(--muted)}
.pbp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.pbp-r{display:grid;grid-template-columns:42px 4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.35}

.pbp-r.sc .pbp-x{font-weight:600}

.foot{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;color:var(--faint);font-size:12px;padding-block:28px 36px}

@keyframes pulse{50%{opacity:.25}}
@keyframes sh{to{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v6: season pickers */
.seasonpick{position:relative;display:inline-flex;align-items:center;flex:none}
.seasonpick select{appearance:none;-webkit-appearance:none;font:600 13px/1 var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 32px 9px 14px;cursor:pointer;max-width:210px;box-shadow:var(--shadow)}

.seasonpick svg{position:absolute;right:11px;width:14px;height:14px;color:var(--muted);pointer-events:none}
.cmp-p .seasonpick select{font-size:12px;padding:7px 28px 7px 11px;max-width:100%}
.pagebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--faint)}

.dayhead>div{min-width:0}

/* preseason games */
.pre-tag{font:600 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 8px}

/* standings zones */
.st .seed{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:600 11px/1 var(--f-data);color:var(--faint);text-align:center}
.st .seed.po{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}

.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row .seed{display:inline-block;width:12px;height:12px;border-radius:4px}
.legend-row .seed.po{background:color-mix(in srgb,var(--good) 45%,transparent)}
.legend-row .seed.pi{background:color-mix(in srgb,var(--warn) 50%,transparent)}

/* search and lists */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{padding-left:42px;box-shadow:var(--shadow)}
.cta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:6px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.cta-row>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.cta-row b{font-weight:600}
.cta-row>span>span{font-size:12.5px;color:var(--faint)}
.cta-row svg{width:18px;height:18px;color:var(--muted);flex:none}
.cta-row:hover{border-color:var(--faint)}
.lr-meter{display:block;height:3px;border-radius:2px;background:var(--surface-2);margin-top:3px;overflow:hidden}
.lr-meter i{display:block;height:100%;border-radius:2px}
.chips.scroller{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px))}
.chips.scroller::-webkit-scrollbar{display:none}
.chips .chip{flex:none}
.box td.best{color:var(--accent);font-weight:600}
.tag.po-tag{margin-left:6px;background:var(--accent-soft);color:var(--accent);font-size:9px;padding:2px 4px}
.srows.tall{max-height:520px;overflow-y:auto}

/* polish */
:root{--r-lg:18px;--r-md:14px;--r-sm:10px}

.dayhead{margin:20px 0 14px}

.sec{margin-top:28px}
.sec h2{font-size:14px;letter-spacing:.11em;margin-bottom:12px}
.games{gap:12px}
.game{border-radius:var(--r-lg);padding:16px 12px 13px}

.seg{border-radius:var(--r-md);padding:4px;margin-top:18px}

.tabs{border-radius:var(--r-md)}

.chip{transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--faint)}
.btn{border-radius:var(--r-sm);transition:border-color .15s,background .15s}
.p-note{line-height:1.5}
.sk i{background:linear-gradient(90deg,var(--surface-2) 25%,color-mix(in srgb,var(--surface-2) 55%,var(--surface)) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
#main.enter{animation:enter .22s ease-out}

.tabbar{padding-top:7px}
.tabbar a{gap:5px;font-size:10.5px}

.tabbar a[aria-current="page"] svg{background:var(--accent-soft)}
.foot{justify-content:center;text-align:center;gap:8px 14px;padding-block:32px 28px;font-size:11.5px}

.perf{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;text-decoration:none;color:inherit;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.perf::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tc)}

.perf-rank{font:700 15px/1 var(--f-display);color:var(--faint);width:14px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.perf .hs{width:52px;height:52px;flex:none}
.perf-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.perf-main b{font:600 15px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf-team{font-size:12px;color:var(--faint)}
.perf-line{font:500 12px/1.2 var(--f-body);color:var(--muted);letter-spacing:.02em}

.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

/* more */
.more-list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}

.more-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.more-t span{font-size:12.5px;color:var(--faint)}
.chev{width:18px;height:18px;color:var(--faint);flex:none}

/* injuries */
.inj-team{margin-top:22px}
.inj-th{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-bottom:8px}

.inj-th b{font:700 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.inj-n{margin-left:auto;font:600 12px/1 var(--f-data);color:var(--faint);background:var(--surface-2);border-radius:999px;padding:4px 9px}

.inj-row{align-items:flex-start}

.lr-name>span.inj-note,.lr-name>span.inj-ret{display:block}

/* playoff picture */
.bracket{display:grid;gap:12px}
@media (min-width:620px){.bracket{grid-template-columns:1fr 1fr}}
.br-col{display:grid;gap:8px;align-content:start}
.br-h{font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.m-note{display:block;font-size:11.5px;color:var(--faint);padding:8px 12px 2px}
.bt{display:flex;align-items:center;gap:9px;padding:9px 12px;text-decoration:none;color:inherit;border-left:3px solid var(--tc,transparent)}

.bt .lg{width:22px;height:22px}
.bt-seed{width:18px;font:600 12px/1 var(--f-data);color:var(--faint);text-align:right}

.bt.tbd .bt-name{font:500 12.5px/1.2 var(--f-body);color:var(--faint);letter-spacing:0}
.bt-rec{font:500 12px/1 var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.race-t{margin-top:10px}
.race-t th,.race-t td{padding-left:6px;padding-right:6px}
.race-t .pl{min-width:90px}
.race-t .box .hd,.race-t .hd{padding:10px 6px}
.race-t td{font-size:12.5px}
.race{display:inline-block;border-radius:6px;padding:3px 7px;font:600 11px/1 var(--f-body);letter-spacing:.03em;white-space:nowrap}
.race.in{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.race.out{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.race.help{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.race.need{color:var(--fg);background:var(--surface-2)}

/* head-to-head */
.h2h{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;border-radius:var(--r-lg);padding:16px 12px;margin-bottom:10px}

.h2h-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.h2h-rec{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.h2h-rec i{font-style:normal;font-weight:500;font-size:22px;color:rgba(255,255,255,.6)}
.h2h-sub{font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.h2h-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.seasonpick.wide select{width:100%;max-width:none}
.h2h{background-color:var(--ca)}
.h2h{color:#FFFFFF;background-image:linear-gradient(100deg,var(--ca) 0%,var(--ca) 25%,var(--cb) 75%,var(--cb) 100%);box-shadow:0 10px 22px -14px rgba(0,0,0,.55)}
/* v8: watch guide */
.ring{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:5}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.wg-strip{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:var(--shadow);position:relative}
a.wg-strip:hover{border-color:var(--faint)}
.wg-strip .ring{width:40px;height:40px;flex:none}
.wg-strip-n{position:absolute;left:14px;width:40px;text-align:center;font:700 14px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wg-strip-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wg-strip-t b{font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.wg-strip-t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgs{display:grid;gap:10px}
.wg{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 14px 18px;text-decoration:none;color:inherit;box-shadow:var(--shadow);overflow:hidden}
a.wg:hover{border-color:var(--faint)}
.wg-bar{position:absolute;inset:0 auto 0 0;width:5px}
.wg-rank{font:700 16px/1 var(--f-display);color:var(--faint);width:16px;text-align:center;flex:none;font-variant-numeric:tabular-nums}

.wg-teams b{font:700 19px/1 var(--f-display);letter-spacing:.03em}
.wg-teams i{font:500 12px/1 var(--f-body);font-style:normal;color:var(--faint)}

.wg-why{display:flex;flex-wrap:wrap;gap:5px}

.why.hot{background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live);font-weight:600}

.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-top:10px;box-shadow:var(--shadow)}
.pick.good{border-color:color-mix(in srgb,var(--good) 55%,var(--line));background:color-mix(in srgb,var(--good) 8%,var(--surface))}

.pick-h{display:flex;flex-direction:column;gap:4px}
.pick-h b{font:700 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em}

.pick .pk-row{margin-top:12px}
.pk-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}

.pk-btn b{font:700 19px/1 var(--f-display);letter-spacing:.03em}
.pk-btn span{white-space:nowrap;margin-left:auto;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pk-btn.on{background:var(--tc);color:#FFFFFF;border-color:var(--tc)}

.pk-btn.on.good{box-shadow:0 0 0 2px var(--good)}

.pk-sc{font:700 17px/1 var(--f-display) !important;letter-spacing:0 !important;color:inherit !important}

.pk-badge.bad{background:rgba(194,50,58,.5)}
.pk-strip{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}

.pk-streak{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none}

.pk-streak i{font:600 7.5px/1 var(--f-body);font-style:normal;letter-spacing:.1em;text-transform:uppercase}
.pk-tiles .tile.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.pk-tiles .tile b{font-size:26px}
.pk-day{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}
.pk-day b{font:700 17px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.pk-day .arr:disabled{opacity:.3;cursor:default}
.pk-list{display:grid;gap:10px}
.pk-game{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px 12px;box-shadow:var(--shadow)}
.pk-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.pk-top span:first-child{color:var(--fg);font-weight:600}
.pk-open{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:600}
.pk-v{font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:4px 7px;background:var(--surface-2);color:var(--muted)}
.pk-v.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pk-v.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.oddsfmt{display:flex;gap:6px}
/* v10: rows with several links (the row link stretches over the row, the others sit on top) */
.lnk-row{position:relative}
.stretch{color:inherit;text-decoration:none}
.stretch::after{content:"";position:absolute;inset:0;z-index:0}
.sub-link{position:relative;z-index:1}
.tlink{color:inherit;text-decoration:none;border-bottom:1px dotted color-mix(in srgb,currentColor 55%,transparent)}

.plain{color:inherit;text-decoration:none}
a.sched-date{color:var(--muted)}
.lnk-row.lrow:hover,.lnk-row.perf:hover{border-color:var(--faint)}
.srow.lnk-row:hover{background:var(--surface-2)}
.lead-hero.lnk-row:hover,.favstrip.lnk-row:hover{filter:brightness(1.05)}
.perf-team .sub-link:not(.tlink){color:var(--accent);text-decoration:none;font-weight:600}
.plink.quiet{border-bottom:0}
.btnlink{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted var(--faint)}
a.pcb,a.mg{text-decoration:none;color:inherit}
a.pcb:hover i,a.mg:hover i{filter:brightness(1.12)}
a.rc-t,a.inj-h,a.h2h-side,a.ss-g{text-decoration:none;color:inherit}
a.ss-g{color:var(--muted)}
a.ss-g:hover b{text-decoration:underline}
.ls tbody th a{color:inherit;text-decoration:none}

/* players tab once the game has started: this game's line only */
.gl-big{display:flex;gap:6px 16px;align-items:baseline;margin-top:9px;flex-wrap:wrap}
.gl-big span{display:inline-flex;align-items:baseline;gap:4px;font:600 10px/1 var(--f-body);letter-spacing:.08em;color:var(--faint)}

.gl-big .pm-neg b{color:var(--bad)}

.dnp-txt{text-transform:uppercase;letter-spacing:.04em;margin-top:8px}

/* player and performance hero */
.pro,.th{--ca:#2B313C;--cb:#2B313C;--ca2:#6C7484;--cb2:#6C7484;position:relative;color:#FFFFFF;overflow:hidden;background-color:var(--ca);
  background-image:radial-gradient(85% 110% at 100% 0%,color-mix(in srgb,var(--ca2) 42%,transparent),transparent 62%),radial-gradient(70% 90% at 0% 100%,rgba(0,0,0,.32),transparent 70%),linear-gradient(165deg,var(--ca) 0%,var(--ca) 55%,color-mix(in srgb,var(--ca) 72%,#000) 100%);
  border-radius:24px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 14px 28px -18px rgba(0,0,0,.6)}
.pro{display:grid;grid-template-columns:minmax(0,1fr) 47%;grid-template-areas:"txt img" "band band";align-items:end;padding:18px 16px 0;min-height:180px}

.pro-img{grid-area:img;line-height:0;position:relative;margin-right:-8px}
.pro .hs.big{width:100%;height:auto;aspect-ratio:1040/760;border-radius:0;background:transparent;overflow:visible}
.pro .hs.big img{object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.pro .hs.big:empty{background:rgba(255,255,255,.12);border-radius:16px 16px 0 0}
.pro-txt{grid-area:txt;align-self:center;position:relative;padding-bottom:16px;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.pro-team{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--f-body);color:rgba(255,255,255,.92);text-decoration:none;margin-bottom:10px;max-width:100%}
a.pro-team:hover{text-decoration:underline}
.pro-team .lg{width:22px;height:22px;background:transparent;border-radius:0}
.pro-first{font:600 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.82)}
.pro-last{font:700 40px/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em;margin:3px 0 8px;max-width:100%}
.pro-last.long{font-size:31px}
.pro-last.xlong{font-size:25px}
.pro-meta{font:500 12.5px/1.35 var(--f-body);color:rgba(255,255,255,.88)}
.pro .tag.onban{margin-top:9px}
.pro-stats,.pro-game{grid-area:band;position:relative;margin:0 -16px;padding:12px 16px;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pro-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.pro-stats span{display:flex;flex-direction:column;align-items:center;gap:5px;border-left:1px solid rgba(255,255,255,.14)}
.pro-stats span:first-child{border-left:0}
.pro-stats b{font:700 27px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pro-stats i{font:600 9.5px/1 var(--f-body);font-style:normal;letter-spacing:.12em;color:rgba(255,255,255,.72)}
.pro-stats em{grid-column:1/-1;text-align:center;font:500 10.5px/1 var(--f-body);font-style:normal;color:rgba(255,255,255,.6);margin-top:10px;letter-spacing:.04em}
.pro-game{display:flex;align-items:center;gap:10px;color:#FFFFFF;text-decoration:none}
.pro-game span{flex:1;min-width:0;font:600 13px/1.2 var(--f-body)}
.pro-game b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pro-game b.w{color:#8DF0BE}
.pro-game b.l{color:#FFA3A8}
.pro-game:hover span{text-decoration:underline}
.live-dot{width:8px;height:8px;border-radius:50%;background:#FF5A6E;flex:none;animation:pulse 1.4s ease-in-out infinite}
@media (max-width:370px){.pro-last{font-size:34px}.pro-last.long{font-size:27px}.pro-last.xlong{font-size:22px}.pro-stats b{font-size:23px}}
@media (min-width:660px){.pro{grid-template-columns:minmax(0,1fr) 40%;min-height:220px}.pro-last{font-size:52px}.pro-last.long{font-size:42px}.pro-last.xlong{font-size:34px}}

/* performance page */

.qb{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}

/* team hero */
.th{padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.th>*{position:relative}
.th-mark{position:absolute!important;right:-56px;top:-44px;width:240px;height:240px;opacity:.15;pointer-events:none;line-height:0}

.th-top>.lg{width:62px;height:62px;background:transparent;border-radius:0;overflow:visible}

.th-id{display:flex;flex-direction:column;gap:5px;min-width:0}
.th-season{font:600 10.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.th h1{font:700 30px/.95 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.01em;text-wrap:balance}

.dots{display:flex;gap:3px}
.dots i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 11px/1 var(--f-display);font-style:normal}

.th-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.th .favtoggle{margin-top:0}
@media (min-width:660px){.th h1{font-size:38px}.th-top>.lg{width:76px;height:76px}}

/* team page sections */
.month{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:16px 2px 8px}
.sec>h2+.month{margin-top:0}
.tps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tp{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;text-decoration:none;color:inherit;padding-bottom:10px;box-shadow:var(--shadow);min-width:0}
a.tp:hover,a.rcard:hover{border-color:var(--faint)}
.tp .hs,.rcard .hs{width:100%;height:auto;aspect-ratio:1040/760;border-radius:0;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 78%,#000),var(--tc))}
.tp .hs img,.rcard .hs img{object-fit:contain;object-position:50% 100%}
.tp-l{font:600 9.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:9px}
.tp b{font:700 30px/1 var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}

.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:620px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);min-width:0}
.rc-name{padding:9px 11px 2px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rc-name b{font:700 17px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rc-stats span{display:flex;flex-direction:column;gap:3px;font:600 9px/1 var(--f-body);letter-spacing:.08em;color:var(--faint)}
.rc-stats b{font:700 19px/1 var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:0}

.ldg-r{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.ldg-h+.ldg-r{border-top:0}
.ldg-i{font:600 11px/1 var(--f-data);color:var(--faint)}
.ldg-n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldg-r:hover .ldg-n{text-decoration:underline}
.ldg-r b{font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.favstrip .fs-txt .tlink{border-bottom-color:rgba(255,255,255,.5)}
.pbp.mine .pbp-r{grid-template-columns:58px 4px minmax(0,1fr) auto}
.pbp.mine .pbp-t{white-space:nowrap}
/* v11: compact grid on Scores */
.tick{position:relative;display:inline-flex;align-items:center;gap:8px;font:600 12.5px/1 var(--f-body);color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;margin-bottom:12px;padding:2px 0}
.tick input{position:absolute;left:0;top:0;width:20px;height:20px;margin:0;opacity:0;cursor:pointer}
.tick-box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);background:var(--surface);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.tick-box svg{width:13px;height:13px;color:var(--on-accent);opacity:0;transition:opacity .12s}
.tick input:checked+.tick-box{background:var(--accent);border-color:var(--accent)}
.tick input:checked+.tick-box svg{opacity:1}
.tick input:focus-visible+.tick-box{outline:2px solid var(--accent);outline-offset:2px}
.tick input:checked~span:last-child{color:var(--fg)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:660px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cg{--ca:#2B313C;--cb:#2B313C;--ca2:#6C7484;--cb2:#6C7484;position:relative;display:flex;flex-direction:column;min-width:0;border-radius:var(--r-md);overflow:hidden;text-decoration:none;color:#FFFFFF;background-color:var(--ca);
  background-image:radial-gradient(90% 55% at 100% 0%,color-mix(in srgb,var(--ca2) 32%,transparent),transparent 70%),radial-gradient(90% 55% at 100% 75%,color-mix(in srgb,var(--cb2) 30%,transparent),transparent 70%),linear-gradient(180deg,var(--ca) 0%,var(--ca) 28%,var(--cb) 58%,var(--cb) 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 18px -12px rgba(0,0,0,.55);transition:filter .15s,transform .15s}
.cg:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cg.is-live{box-shadow:0 0 0 2px var(--live),0 8px 18px -12px rgba(0,0,0,.55)}
.cg-teams{display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px}
.cg-t{display:flex;align-items:center;gap:9px;min-width:0}
.cg-t .lg{width:30px;height:30px;background:transparent;border-radius:0;overflow:visible}
.cg-t .lg img{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cg-t .lg:empty{background:rgba(255,255,255,.16);border-radius:50%}
.cg-t .lg:empty::after{color:#FFFFFF;font-size:10px}
.cg-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cg-n b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.cg-n i{font:500 11.5px/1.15 var(--f-body);font-style:normal;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-t.lost{opacity:.6}
.cg-w{flex:none;width:0;height:0;border-style:solid;border-width:6px 8px 6px 0;border-color:transparent #FFFFFF transparent transparent;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.cg-foot{margin-top:auto;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:46px;padding:7px 10px 8px;background:rgba(0,0,0,.3);font:500 11.5px/1.2 var(--f-body);color:rgba(255,255,255,.86)}
.cg-foot b{color:#FFFFFF;font-weight:600}
.cg-l1{display:flex;align-items:center;gap:6px;min-width:0}
.cg-st{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-l2{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;min-height:34px}

<script>
(() => {
'use strict';

const API = 'https://site.api.espn.com/apis/site/v2/sports/';
const LEAGUES = {
  nba:  { label: 'NBA',              path: 'basketball/nba',        sport: 'bb' },
  wnba: { label: 'WNBA',             path: 'basketball/wnba',       sport: 'bb' },
  nhl:  { label: 'NHL',              path: 'hockey/nhl',            sport: 'hk' },
  nfl:  { label: 'NFL',              path: 'football/nfl',          sport: 'fb' },
  mlb:  { label: 'MLB',              path: 'baseball/mlb',          sport: 'bs' },
  epl:  { label: 'Premier League',   path: 'soccer/eng.1',          sport: 'sc' },
  ucl:  { label: 'Champions League', path: 'soccer/uefa.champions', sport: 'sc' },
};
const ORDER = ['nba', 'wnba', 'nhl', 'nfl', 'mlb', 'epl', 'ucl'];

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const store = {
  get(k, d) { try { const v = localStorage.getItem('courtside.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('courtside.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked: setting lasts this visit only */ } },
};

function ymdInTZ(d, tz) {
  const p = {};
  for (const x of new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d)) p[x.type] = x.value;
  return p.year + p.month + p.day;
}
// The "game day" rolls over at 6am US Eastern (noon in Prague), so a morning check still shows last night's games.
const gameDayNow = () => ymdInTZ(new Date(Date.now() - 6 * 36e5), 'America/New_York');
const dayToDate = day => new Date(Date.UTC(+day.slice(0, 4), +day.slice(4, 6) - 1, +day.slice(6, 8), 12));
function addDays(day, n) {
  const d = dayToDate(day); d.setUTCDate(d.getUTCDate() + n);
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate());
}
const fmtDayLong = new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });
const fmtWk = new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'short' });
const fmtLocal = new Intl.DateTimeFormat('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const fmtUS = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', weekday: 'short', day: 'numeric', month: 'short' });
const fmtUSshort = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', day: 'numeric', month: 'short' });
const fmtClock = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

function num(v) {
  const s = String(v ?? '').trim();
  const m = s.match(/^([+-]?\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : -Infinity;
}
function logoSrc(u, size) {
  if (!u) return '';
  const m = u.match(/^https?:\/\/a\.espncdn\.com\/(i\/[^?]+\.png)$/i);
  return m ? `https://a.espncdn.com/combiner/i?img=/${m[1]}&w=${size}&h=${size}&transparent=true` : u;
}
// ESPN keeps a dark-background version of each team logo at .../500-dark/...; other leagues may not have one, so fall back.
function darkLogo(u) {
  const m = (u || '').match(/^(https?:\/\/a\.espncdn\.com\/i\/teamlogos\/[a-z0-9.\-]+\/)500\/([^?]+\.png)$/i);
  return m ? `${m[1]}500-dark/${m[2]}` : '';
}
function logo(s, size = 30, onDark = false) {
  if (!s) return '';
  const chain = [onDark ? darkLogo(s.logo) : '', logoSrc(s.logo, size * 3), s.logo].filter((u, i, a) => u && a.indexOf(u) === i);
  const img = chain.length ? `<img src="${esc(chain[0])}" data-fb="${esc(chain.slice(1).join('|'))}" alt="" loading="lazy" decoding="async">` : '';
  return `<span class="lg" data-ab="${esc((s.abbr || '?').slice(0, 4))}">${img}</span>`;
}

/* ---------- team colours: saturated banners from ESPN's team colours ---------- */
const HEX = /^[0-9a-f]{6}$/i;
const rgbOf = hex => [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
function lum(hex) {
  if (!HEX.test(hex || '')) return null;
  const c = rgbOf(hex).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function toHsl(hex) {
  const [r, g, b] = rgbOf(hex), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
  }
  return { h, s, l };
}
function fromHsl(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}
const isGrey = hex => toHsl(hex).s < .2; // black, silver, white stay neutral instead of turning blue
const isGold = hex => { const c = toHsl(hex); return c.s > .25 && c.h >= 38 && c.h <= 72; }; // gold goes muddy when darkened
function baseColor(s) {
  const c = [s?.color, s?.alt].filter(x => HEX.test(x || ''));
  return c.find(x => lum(x) <= .4 && !isGold(x)) || c.find(x => lum(x) < .85) || null;
}
function similar(x, y) {
  if (isGrey(x) && isGrey(y)) return true;
  if (isGrey(x) || isGrey(y)) return false;
  const d = Math.abs(toHsl(x).h - toHsl(y).h);
  return Math.min(d, 360 - d) < 24;
}
function saturated(hex) { const c = toHsl(hex); if (c.s >= .2) c.s = Math.min(1, c.s * 1.15 + .22); return c; }
// Banner: punchy but dark enough that white text stays readable (contrast with white at least ~6:1).
function bannerOf(hex) {
  const c = saturated(hex);
  let l = Math.min(Math.max(c.l, .2), .5), out = fromHsl(c.h, c.s, l);
  while (lum(out) > .12 && l > .08) { l -= .01; out = fromHsl(c.h, c.s, l); }
  return '#' + out;
}
// Bright: the same hue at mid lightness, for bars and dots on the page background.
function brightOf(hex) { const c = saturated(hex); return '#' + fromHsl(c.h, c.s, Math.min(Math.max(c.l, .44), .56)); }
function matchupColors(a, b) {
  let ca = baseColor(a), cb = baseColor(b);
  if (ca && cb && similar(ca, cb)) {
    const other = (s, cur, vs) => [s?.alt, s?.color].find(x => HEX.test(x || '') && x.toLowerCase() !== cur.toLowerCase() && lum(x) < .85 && !isGold(x) && !similar(x, vs));
    const nb = other(b, cb, ca);
    if (nb) cb = nb; else { const na = other(a, ca, cb); if (na) ca = na; }
  }
  ca = ca || '3a4150'; cb = cb || '3a4150';
  return { a: { banner: bannerOf(ca), bright: brightOf(ca) }, b: { banner: bannerOf(cb), bright: brightOf(cb) } };
}
const bannerStyle = m => `--ca:${m.a.banner};--cb:${m.b.banner};--ca2:${m.a.bright};--cb2:${m.b.bright}`;

/* ---------- ESPN data shaping ---------- */
function side(x) {
  if (!x) return null;
  const t = x.team || {};
  const recs = x.records || x.record || [];
  const rec = (recs.find(r => r.type === 'total' || r.name === 'overall' || r.name === 'All Splits') || recs[0] || {}).summary || '';
  return {
    id: String(t.id ?? ''), abbr: t.abbreviation || '', name: t.shortDisplayName || t.name || t.displayName || '',
    full: t.displayName || '', logo: t.logo || t.logos?.[0]?.href || '', color: t.color, alt: t.alternateColor,
    score: x.score ?? '', winner: x.winner === true, record: rec,
    lines: (x.linescores || []).map(l => l.displayValue ?? l.value ?? ''), leaders: x.leaders || [],
  };
}
function parseEvent(ev) {
  const c = ev.competitions?.[0] || {};
  const comps = c.competitors || [];
  const st = ev.status?.type || c.status?.type || {};
  const tv = [];
  for (const b of c.broadcasts || []) for (const n of b.names || []) if (!tv.includes(n)) tv.push(n);
  return {
    id: String(ev.id), date: ev.date, state: st.state || 'pre', completed: !!st.completed,
    short: st.shortDetail || st.detail || '', period: ev.status?.period || c.status?.period || 0,
    clock: ev.status?.displayClock || c.status?.displayClock || '',
    away: side(comps.find(x => x.homeAway === 'away') || comps[1]),
    home: side(comps.find(x => x.homeAway === 'home') || comps[0]),
    venue: c.venue?.fullName || '', city: [c.venue?.address?.city, c.venue?.address?.state].filter(Boolean).join(', '),
    tv, note: c.notes?.[0]?.headline || '', series: c.series?.summary || '', odds: c.odds?.[0] || null,
    preseason: ev.season?.type === 1 || ev.season?.slug === 'preseason',
  };
}
const ordered = (e, L) => { if (e.preseason) { if (e.home) e.home.record = ''; if (e.away) e.away.record = ''; } return L.sport === 'sc' ? [e.home, e.away] : [e.away, e.home]; };

function statusText(e, L) {
  const s = e.short || '';
  if (e.state === 'pre') {
    if (/postpon|cancel|delay|suspend/i.test(s)) return s;
    if (/tbd/i.test(s)) return 'Time TBD';
    return e.date ? fmtLocal.format(new Date(e.date)) : s;
  }
  if (e.state === 'in') {
    if (/half/i.test(s)) return 'Halftime';
    if (/^end|end of/i.test(s)) return s;
    if (L.sport === 'bb' && e.period) return `${e.period <= 4 ? 'Q' + e.period : e.period === 5 ? 'OT' : (e.period - 4) + 'OT'} ${e.clock}`.trim();
    if (L.sport === 'hk' && e.period) return `${e.period <= 3 ? 'P' + e.period : 'OT'} ${e.clock}`.trim();
    return s;
  }
  return s || 'Final';
}
function periodLabels(n, sport) {
  const out = [];
  for (let i = 0; i < n; i++) {
    let l = String(i + 1);
    if (sport === 'bb' && i >= 4) l = i === 4 ? 'OT' : `${i - 3}OT`;
    if (sport === 'hk' && i >= 3) l = i === 3 ? 'OT' : 'SO';
    if (sport === 'fb' && i >= 4) l = 'OT';
    if (sport === 'sc') l = ['1H', '2H', 'ET1', 'ET2', 'PEN'][i] || l;
    out.push(l);
  }
  return out;
}
function topScorer(s) {
  const cat = (s?.leaders || []).find(l => l.name === 'points');
  const p = cat?.leaders?.[0];
  if (!p) return null;
  return { name: p.athlete?.shortName || p.athlete?.displayName || '', val: p.value != null ? Math.round(p.value) : p.displayValue };
}

/* ---------- state ---------- */
const state = {
  nbaOnly: store.get('nbaOnly', true),
  league: 'nba', view: 'scores', day: gameDayNow(), gameId: null, playerId: null, teamId: null, cmpA: null, cmpB: null,
  summary: null, summaryErr: false, boxTeam: null, sort: null, gameTab: null, pTeam: null,
  pbp: null, shotTeam: null, shotPlayer: '', pbpPeriod: null, pbpScoring: false,
  leadCat: store.get('leadCat', 'pts'), q: '', cq: '', fav: store.get('fav', null),
  season: null, cmpSeasonA: null, cmpSeasonB: null, glSeason: null, h2hA: null, h2hB: null, injFilter: 'all', tabs: {}, glFor: null, compact: store.get('compact', false), oddsFmt: store.get('oddsFmt', 'dec'),
  error: null, updated: null,
};
const boards = new Map();     // "league/day" -> scoreboard JSON
const calendars = new Map();  // league -> Set of YYYYMMDD with games
const boardKey = () => state.league + '/' + state.day;

async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function curEvent() {
  const raw = (boards.get(boardKey())?.events || []).find(x => String(x.id) === state.gameId);
  return raw ? parseEvent(raw) : null;
}
const gameTab = e => state.gameTab || (e && e.state === 'pre' ? 'matchup' : 'game');
const usesBoard = () => state.view === 'scores' || state.view === 'watch' || state.view === 'picks' || state.view === 'game' || (state.view === 'player' && !!state.gameId);

let token = 0, timer = null;
async function load() {
  const my = ++token;
  const { league, day, gameId } = state;
  const L = LEAGUES[league];
  clearTimeout(timer);
  if (!usesBoard()) { render(); schedule(); return; }
  try {
    const jobs = [getJSON(`${API}${L.path}/scoreboard?dates=${day}`)];
    if (gameId) jobs.push(getJSON(`${API}${L.path}/summary?event=${gameId}`).catch(() => null));
    const [board, sum] = await Promise.all(jobs);
    if (my !== token) return;
    boards.set(league + '/' + day, board);
    const cal = board?.leagues?.[0]?.calendar;
    if (Array.isArray(cal) && cal.length && typeof cal[0] === 'string') {
      calendars.set(league, new Set(cal.map(s => s.slice(0, 10).replace(/-/g, ''))));
    }
    if (gameId) { if (sum) { state.summary = sum; state.summaryErr = false; } else if (!state.summary) state.summaryErr = true; }
    state.error = null;
    state.updated = Date.now();
  } catch (e) {
    if (my !== token) return;
    state.error = e;
  }
  render();
  schedule();
  settlePicks();
  if (gameId && state.view === 'game' && L.sport === 'bb') {
    const e = curEvent();
    if (e && e.state !== 'pre' && gameTab(e) === 'plays') {
      await loadPlays(gameId, e.state === 'post');
      if (my === token) renderMain();
    }
  }
  // a single-game performance page needs the plays for his quarters, shots and play list
  if (gameId && state.view === 'player' && state.league === 'nba') {
    const e = perfCtx();
    if (e && e !== 'loading') {
      await loadPlays(gameId, e.state === 'post');
      if (my === token) renderMain();
    }
  }
}
function schedule() {
  clearTimeout(timer);
  let ms = 300000;
  if (usesBoard()) {
    const evs = (boards.get(boardKey())?.events || []).map(parseEvent);
    const scope = state.gameId ? evs.filter(e => e.id === state.gameId) : evs;
    if (scope.some(e => e.state === 'in')) ms = 20000;
    else if (scope.some(e => e.state === 'pre' && e.date && Date.parse(e.date) - Date.now() < 30 * 60e3)) ms = 60000;
    if (state.error) ms = Math.min(ms, 60000);
  }
  timer = setTimeout(() => { if (!document.hidden) load(); }, ms);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!state.updated || Date.now() - state.updated > 20000)) load();
});

/* ---------- play-by-play data: the game summary, or ESPN's play feed when the summary has none ---------- */
const refId = (ref, kind) => (String(ref || '').match(new RegExp('/' + kind + '/(\\d+)')) || [])[1] || '';
function normPlay(p) {
  const c = p.coordinate || {};
  return {
    id: String(p.id ?? ''), seq: parseInt(p.sequenceNumber, 10) || 0,
    period: p.period?.number ?? 0, clock: p.clock?.displayValue ?? '',
    text: String(p.text || p.type?.text || '').replace(/\s*\n\s*/g, ' '), type: p.type?.text || '',
    home: p.homeScore ?? '', away: p.awayScore ?? '', scoring: !!p.scoringPlay, value: p.scoreValue ?? 0,
    shooting: !!p.shootingPlay, pa: p.pointsAttempted ?? null,
    x: typeof c.x === 'number' ? c.x : null, y: typeof c.y === 'number' ? c.y : null,
    team: String(p.team?.id ?? refId(p.team?.$ref, 'teams')),
    athletes: (p.participants || []).map(x => String(x.athlete?.id ?? refId(x.athlete?.$ref, 'athletes'))).filter(Boolean),
  };
}
const normProb = (x, i) => ({ playId: String(x.playId ?? refId(x.play?.$ref, 'plays')), p: parseFloat(x.homeWinPercentage), seq: parseInt(x.sequenceNumber, 10) || i });
async function coreAll(url) {
  const first = await getJSON(url + '?limit=1000');
  let items = first.items || [];
  const pages = Math.min(first.pageCount || 1, 12);
  for (let p = 2; p <= pages; p++) items = items.concat((await getJSON(`${url}?limit=1000&page=${p}`)).items || []);
  return items;
}
async function loadPlays(gid, final) {
  if (final && state.pbp?.gid === gid && !state.pbp.err) return;
  const L = LEAGUES[state.league];
  const sum = state.summary;
  let plays = Array.isArray(sum?.plays) && sum.plays.length ? sum.plays : null;
  let probs = Array.isArray(sum?.winprobability) && sum.winprobability.length ? sum.winprobability : null;
  try {
    if (!plays || !probs) {
      const base = `https://sports.core.api.espn.com/v2/sports/${L.path.replace('/', '/leagues/')}/events/${gid}/competitions/${gid}/`;
      const [cp, cr] = await Promise.all([plays ? null : coreAll(base + 'plays'), probs ? null : coreAll(base + 'probabilities').catch(() => [])]);
      plays = plays || cp; probs = probs || cr;
    }
    if (state.gameId !== gid) return;
    state.pbp = { gid, plays: plays.map(normPlay), probs: (probs || []).map(normProb).filter(x => Number.isFinite(x.p)).sort((a, b) => a.seq - b.seq), err: false };
  } catch (e) {
    if (state.gameId !== gid) return;
    const old = state.pbp?.gid === gid ? state.pbp : null;
    state.pbp = { gid, plays: old?.plays || [], probs: old?.probs || [], err: true };
  }
}
function ensurePlays() {
  const e = curEvent(), gid = state.gameId;

/* ---------- routing ----------
   #/nba/20261020                 scores for a US game day
   #/nba/20261020/401909088       a game (…/p/<id> for a player opened from that game)
   #/nba/p/<id>  #/nba/t/<id>  #/nba/standings  #/nba/leaders  #/nba/players  #/nba/compare/<a>/<b>  #/nba/fav */

  const lg = r.league || state.league;

    case 'game': return `#/${lg}/${r.day}/${r.gameId}`;
    case 'player': return r.gameId ? `#/${lg}/${r.day}/${r.gameId}/p/${r.playerId}` : `#/${lg}/p/${r.playerId}`;
    case 'team': return `#/${lg}/t/${r.teamId}`;
    case 'standings': case 'leaders': case 'players': case 'fav': case 'more': case 'injuries': case 'playoffs': return `#/${lg}/${r.view}`;
    case 'picks': return `#/${lg}/picks/${r.day || state.day}`;

    case 'h2h': return `#/${lg}/h2h${r.h2hA ? '/' + r.h2hA : ''}${r.h2hA && r.h2hB ? '/' + r.h2hB : ''}`;

    return { ...base, view: 'game', day: a, gameId: b };
  }

  if (a === 't' && isId(b)) return { ...base, view: 'team', teamId: b };
  if (['standings', 'leaders', 'players', 'fav', 'more', 'injuries', 'playoffs'].includes(a)) return { ...base, view: a };
  if (a === 'picks') return { ...base, view: 'picks', day: /^\d{8}$/.test(b || '') ? b : null };
  if (a === 'watch') return { ...base, view: 'watch', day: /^\d{8}$/.test(b || '') ? b : null };

const plHref = pid => state.gameId ? hashFor({ view: 'player', day: state.day, gameId: state.gameId, playerId: pid }) : hashFor({ view: 'player', playerId: pid });
const teamHref = tid => hashFor({ view: 'team', teamId: tid });

  if (state.nbaOnly && r.league !== 'nba') r = { league: 'nba', view: 'scores', day: r.day };
  if (r.league !== 'nba' && !['scores', 'game'].includes(r.view) && !(r.view === 'player' && r.gameId)) r = { league: r.league, view: 'scores' };

    state.gameTab = null; state.pTeam = null; state.pbp = null; state.shotTeam = null; state.shotPlayer = ''; state.pbpPeriod = null;

const DRILL = ['game', 'player', 'team', 'compare', 'fav', 'injuries', 'playoffs', 'h2h', 'watch', 'picks'];

const VIEWS = { scores: listView, game: gameView, player: playerPage, team: teamView, standings: standingsView, leaders: leadersView, players: searchView, compare: compareView, fav: favView, more: moreView, injuries: injuriesView, playoffs: playoffsView, h2h: h2hView, watch: watchView, picks: picksView };

const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17l-5.8 3.3 1.4-6.4L2.7 9.5l6.5-.7z" fill="currentColor"/></svg>';

// Compact grid cell: two team rows (record before the game, score after) over a status strip.
function gridCell(e, L, fav) {
  const pre = e.state === 'pre', live = e.state === 'in', done = e.state === 'post' && e.completed;
  const [A, B] = ordered(e, L);
  const m = matchupColors(A, B);
  const row = (s, o) => {

  };

  const pb = state.league === 'nba' ? pickBadge(e) : '';

/* ---------- win probability ---------- */
function mlOf(o, side) {
  if (!o) return null;
  const x = o.moneyline?.[side];
  let v = x?.close?.odds ?? x?.current?.odds ?? x?.open?.odds;
  if (v == null && x && typeof x.close !== 'object') v = x.close ?? x.open;
  if (v == null) v = o[side + 'TeamOdds']?.moneyLine;
  if (v == null) return null;
  const s = String(v).trim().toUpperCase();
  const n = s === 'EVEN' ? 100 : parseFloat(s);
  return Number.isFinite(n) && Math.abs(n) >= 100 ? n : null;
}

function oddsProb(o) {

  }
  if (pHome == null) {

  }

const res = new Map(); // key -> {status, data}
function need(key, fn, ttl) {
